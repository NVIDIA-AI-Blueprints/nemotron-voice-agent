#
# OpenShell sandbox policy of the FDH OpenShell runtime: the FDH gateway and its Hermes workers run as
# UID 1500, with the code and packages read-only and only the paths they already write writable
# (/app/logs, /app/.cache/fdh-hermes-homes, /tmp/fdh-workers). Schema: OpenShell
# docs/how-it-works/policies/schema.mdx at the release in VERSION.
#
# The backend LLM host is not listed here: the provider profile (nvidia-fdh.yaml) adds that rule, with
# the key. Add under network_policies any other host the plain runtime is found to call
# (shared-stack-plan.md, step 7 item 6), so Hermes sees the same network as in the plain runtime.
version: 1
process:
  run_as_user: "1500"
  run_as_group: "1500"
filesystem_policy:
  include_workdir: false              # every writable path is listed below; nothing is added implicitly
  read_only: [/bin, /usr, /lib, /lib64, /etc, /proc, /dev/urandom, /app, /opt/python, /opt/hermes]
  read_write: [/sandbox, /tmp, /dev/null, /app/logs, /app/.cache]
landlock:
  compatibility: hard_requirement     # fail closed, never run without Landlock
network_policies: {}
