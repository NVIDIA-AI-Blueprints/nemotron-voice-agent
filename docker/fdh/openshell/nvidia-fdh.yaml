#
# OpenShell provider profile of the FDH OpenShell runtime: a copy of OpenShell's providers/nvidia.yaml
# with the host Hermes calls (BACKEND_LLM_BASE_URL in docker/fdh/gateway.env) and Hermes' interpreter.
#
# Inside the sandbox NVIDIA_API_KEY holds only a placeholder; the supervisor puts the real key into the
# Authorization header, and only for this host and this interpreter. Hermes reads the variable as before.
# The real key reaches only the `fdh-hermes` controller (from .env), never the sandbox.
#
# binaries: the real interpreter (/app/.venv/bin/python is a symlink to it; uv installs Python 3.14.7
# under /opt/python, UV_PYTHON_INSTALL_DIR in docker/Dockerfile.fdh). Worker subprocesses run the same
# interpreter.
id: nvidia-fdh
display_name: NVIDIA (FDH backend)
description: The NVIDIA inference endpoint of the FDH Hermes backend
credentials:
  - name: api_key
    description: NVIDIA API key
    env_vars: [NVIDIA_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
endpoints:
  - host: inference-api.nvidia.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/opt/python/cpython-3.14.7-linux-*/bin/python3.14]
