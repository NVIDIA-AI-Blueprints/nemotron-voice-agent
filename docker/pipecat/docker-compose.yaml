# Pipecat app services. The root docker-compose.yml includes this file, so run every command from the repository root.

include:
  - path: ../sidecars/docker-compose.nemotron35-lightning-nim.yaml
  - path: ../sidecars/docker-compose.nemotron35-lightning.yaml
  - path: ../sidecars/docker-compose.dynamo-lightning.yaml
  - path: ../sidecars/docker-compose.nemotron35-super-vl.yaml
  - path: ../sidecars/docker-compose.nemotron35-bolt.yaml
  - path: ../sidecars/docker-compose.nemotron35-bolt-e4b.yaml
  - path: ../sidecars/docker-compose.nemotron3-omni-nim.yaml
  - path: ../sidecars/docker-compose.nemotron-asr.yaml
  - path: ../sidecars/docker-compose.nemotron-transcribe.yaml
  - path: ../sidecars/docker-compose.parakeet-asr.yaml
  - path: ../sidecars/docker-compose.magpie-tts.yaml
  - path: ../sidecars/docker-compose.chatterbox-tts.yaml
  - path: ../sidecars/docker-compose.magpie-zeroshot-tts.yaml
  - path: ../sidecars/docker-compose.nemotron3-omni.yaml
  - path: ../sidecars/docker-compose.nemo-speech-cpp.yaml
  - path: ../sidecars/docker-compose.coturn.yaml
  - path: ../sidecars/docker-compose.phoenix.yaml

x-app: &app-base
  build:
    context: ../..
    dockerfile: docker/pipecat/Dockerfile
  image: nemotron-voice-agent:latest
  pull_policy: build
  command: ["nva-pipecat", "--host", "0.0.0.0"]
  ports:
    - "${PIPELINE_APP_PORT:-7860}:7860"
  env_file:
    - ../../.env
  volumes:
    - ../../src:/app/src:ro
    - ../../examples_registry.yaml:/app/examples_registry.yaml:ro
    - ../../services.yaml:/app/services.yaml:ro
    - ../../settings.yaml:/app/settings.yaml:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD-SHELL", "curl -fk $$(test \"$$(printf %s \"$${PIPELINE_TLS:-true}\" | tr '[:upper:]' '[:lower:]')\" = true && echo https || echo http)://localhost:7860/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

x-app-env: &app-env
  APP_RUNTIME: container
  TRANSPORT_SELECTION: ${TRANSPORT_SELECTION:-}
  PIPELINE_TLS: ${PIPELINE_TLS:-true}

services:
  generic-assistant:
    <<: *app-base
    profiles:
      - generic-assistant
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-generic-assistant}
      SERVICE_RECIPE: cloud

  generic-assistant-server:
    <<: *app-base
    profiles:
      - generic-assistant/server
    environment:
      <<: *app-env
      SERVICE_RECIPE: server
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-generic-assistant}

  # No SERVICE_RECIPE: the Dynamo LLM lives in the server catalog next to the
  # Lightning NIM, which this recipe does not run, so reachability selects it.
  generic-assistant-dynamo:
    <<: *app-base
    profiles:
      - generic-assistant/dynamo
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-generic-assistant}

  generic-assistant-single-gpu:
    <<: *app-base
    profiles:
      - generic-assistant/single-gpu
    environment:
      <<: *app-env
      SERVICE_RECIPE: single-gpu
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-generic-assistant}

  generic-assistant-server-perf:
    <<: *app-base
    profiles:
      - generic-assistant/server-perf
    environment:
      <<: *app-env
      SERVICE_RECIPE: server
      EXAMPLE_SELECTION: generic-assistant
      UVICORN_WORKERS: "200"
      PROMPT_FILE_PATH: ${PROMPT_FILE_PATH:-}
      PROMPT_SELECTOR: ${PROMPT_SELECTOR:-}
      USE_SILERO_VAD_TURN_DETECTION: "true"
      SILERO_VAD_STOP_SECS: "0.5"
      AUDIO_OUT_10MS_CHUNKS: "40"
      ENABLE_WELCOME_MESSAGE: "false"

  # Many single-worker replicas behind one HAProxy listener. Replaces the 200 Uvicorn workers of
  # generic-assistant/server-perf, whose WebSocket connections concentrate on a few workers.
  # Scale with PERF_APP_REPLICAS. Session-config flows need sticky routing, so use this recipe
  # for the scaling benchmark, not the browser UI.
  generic-assistant-server-perf-replica:
    <<: *app-base
    profiles:
      - generic-assistant/server-perf-replicas
    ports: !override []
    deploy:
      replicas: ${PERF_APP_REPLICAS:-16}
    environment:
      <<: *app-env
      SERVICE_RECIPE: server
      EXAMPLE_SELECTION: generic-assistant
      UVICORN_WORKERS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PROMPT_FILE_PATH: ${PROMPT_FILE_PATH:-}
      PROMPT_SELECTOR: ${PROMPT_SELECTOR:-}
      USE_SILERO_VAD_TURN_DETECTION: "true"
      SILERO_VAD_STOP_SECS: "0.5"
      AUDIO_OUT_10MS_CHUNKS: "40"
      ENABLE_WELCOME_MESSAGE: "false"
      NVA_ASR_INPUT_BATCH_MS: ${NVA_ASR_INPUT_BATCH_MS:-0}

  generic-assistant-server-perf-proxy:
    image: haproxy:3.0-alpine
    profiles:
      - generic-assistant/server-perf-replicas
    depends_on:
      - generic-assistant-server-perf-replica
    ports:
      - "${PIPELINE_APP_PORT:-7860}:7860"
    volumes:
      - ./haproxy-replicas.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped

  multilingual-assistant:
    <<: *app-base
    profiles:
      - multilingual-assistant
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-multilingual-assistant}
      SERVICE_RECIPE: cloud

  multilingual-assistant-server:
    <<: *app-base
    profiles:
      - multilingual-assistant/server
    environment:
      <<: *app-env
      SERVICE_RECIPE: server
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-multilingual-assistant}

  multilingual-assistant-single-gpu:
    <<: *app-base
    profiles:
      - multilingual-assistant/single-gpu
    environment:
      <<: *app-env
      SERVICE_RECIPE: single-gpu
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-multilingual-assistant}

  multilingual-assistant-dynamo:
    <<: *app-base
    profiles:
      - multilingual-assistant/dynamo
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-multilingual-assistant}

  omni-assistant:
    <<: *app-base
    profiles:
      - omni-assistant
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant}
      SERVICE_RECIPE: cloud

  omni-assistant-server:
    <<: *app-base
    profiles:
      - omni-assistant/server
    environment:
      <<: *app-env
      SERVICE_RECIPE: server
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant}

  omni-assistant-single-gpu:
    <<: *app-base
    profiles:
      - omni-assistant/single-gpu
    environment:
      <<: *app-env
      SERVICE_RECIPE: single-gpu
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant}

  omni-assistant-subagents:
    <<: *app-base
    profiles:
      - omni-assistant-subagents
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant-subagents}
      SERVICE_RECIPE: cloud

  omni-assistant-subagents-server:
    <<: *app-base
    profiles:
      - omni-assistant-subagents/server
    environment:
      <<: *app-env
      SERVICE_RECIPE: server
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant-subagents}

  omni-assistant-subagents-single-gpu:
    <<: *app-base
    profiles:
      - omni-assistant-subagents/single-gpu
    environment:
      <<: *app-env
      SERVICE_RECIPE: single-gpu
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant-subagents}

  frontend-backend-live:
    <<: *app-base
    profiles:
      - frontend-backend-live
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-frontend-backend-live}
      SERVICE_RECIPE: cloud

  frontend-backend-live-server:
    <<: *app-base
    profiles:
      - frontend-backend-live/server
    environment:
      <<: *app-env
      SERVICE_RECIPE: server
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-frontend-backend-live}

  frontend-backend-live-single-gpu:
    <<: *app-base
    profiles:
      - frontend-backend-live/single-gpu
    environment:
      <<: *app-env
      SERVICE_RECIPE: single-gpu
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-frontend-backend-live}
