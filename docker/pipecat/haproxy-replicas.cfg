# Spreads TCP connections to the Pipecat replicas of generic-assistant/server-perf-replicas.
# The app terminates TLS itself, so the proxy passes the stream through and keeps each
# WebSocket on the replica with the fewest open connections.
global
  maxconn 4096

defaults
  mode tcp
  timeout connect 5s
  timeout client 600s
  timeout server 600s

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 2s
  accepted_payload_size 8192

frontend voice
  bind :7860
  default_backend replicas

backend replicas
  balance leastconn
  server-template app 1-128 generic-assistant-server-perf-replica:7860 check inter 4s resolvers docker init-addr libc,none
