# Nemotron 3.5 Bolt E4B (8B total, 4B effective). `nemotron-35-bolt-e4b` is the
# NIM for */server recipes; `nemotron-35-bolt-e4b-vllm` serves the BF16 HF
# checkpoint for */single-gpu recipes (with the NVFP4 DFlash drafter on
# Blackwell GPUs) and also serves /v1/streaming-session for the Streaming Input
# toggle.
services:
  nemotron-35-bolt-e4b:
    profiles:
      - nemotron-35-bolt-e4b
    image: nvcr.io/nim/nvidia/nemotron-3.5-bolt-e4b-4gb:2.1.4
    user: "0:0"
    environment:
      - NGC_API_KEY=${NVIDIA_API_KEY:-not-needed}
      - NIM_HTTP_API_PORT=8000
      - NIM_PASSTHROUGH_ARGS=--served-model-name nvidia/nemotron-3.5-bolt-e4b --enable-auto-tool-choice --tool-call-parser gemma4 --reasoning-parser gemma4
      - NIM_KVCACHE_PERCENT=0.45
      - NIM_MAX_MODEL_LEN=32768
    ports:
      - "18004:8000"
    volumes:
      - llm_cache:/opt/nim/.cache
    shm_size: 16GB
    ulimits:
      nofile: 2048
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/v1/health/ready\").read()' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 1800s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  nemotron-35-bolt-e4b-vllm:
    profiles:
      - nemotron-35-bolt-e4b-single-gpu
    image: vllm/vllm-openai:v0.31.0
    pull_policy: if_not_present
    shm_size: 16GB
    env_file:
      - ../.env
    environment:
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
    ports:
      - "18004:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.cache/flashinfer:/root/.cache/flashinfer
      - llm_cache:/root/.cache/vllm
      - ../src:/app/src:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        model=nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-BF16
        args=(
          --host 0.0.0.0
          --port 8000
          --served-model-name nvidia/nemotron-3.5-bolt-e4b
          --dtype bfloat16
          --max-model-len 32768
          --max-num-seqs 8
          --enable-auto-tool-choice
          --tool-call-parser gemma4
          --reasoning-parser gemma4
          --enable-prefix-caching
          --attention-backend TRITON_ATTN
        )

        gpu_name="$$(nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null | head -n1)"
        compute_cap="$$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader 2>/dev/null | head -n1)"
        device_model=""
        dmi_product=""
        [[ -r /proc/device-tree/model ]] && device_model="$$(tr -d '\0' </proc/device-tree/model)"
        [[ -r /sys/class/dmi/id/product_name ]] && dmi_product="$$(tr -d '\0' </sys/class/dmi/id/product_name)"
        compute_major="$${compute_cap%%.*}"

        unified=0
        dflash=0
        max_util=0.90
        if [[ "$${gpu_name}" == *"NVIDIA GB10"* || "$${dmi_product}" == *"DGX_Spark"* ]]; then
          echo "Bolt E4B recipe: DGX Spark / BF16 / DFlash NVFP4"
          unified=1
          max_util=0.75
          dflash=1
        elif [[ "$${device_model}" == *"Jetson"* && "$${device_model}" == *"Thor"* ]] ||
             [[ "$${dmi_product}" == *"Jetson"* && "$${dmi_product}" == *"Thor"* ]]; then
          echo "Bolt E4B recipe: Jetson Thor / BF16 / DFlash NVFP4"
          unified=1
          max_util=0.75
          export MAX_JOBS=1
          echo "FlashInfer JIT: MAX_JOBS=1"
          dflash=1
        elif [[ "$${compute_major}" =~ ^[0-9]+$ ]] && (( compute_major >= 10 )); then
          echo "Bolt E4B recipe: Blackwell workstation / BF16 / DFlash NVFP4"
          dflash=1
        elif [[ "$${compute_major}" =~ ^[0-9]+$ ]] && (( compute_major >= 8 )); then
          echo "Bolt E4B recipe: Hopper/Ada/Ampere workstation / BF16"
        else
          echo "Unsupported GPU for Bolt E4B single-GPU (needs SM80+): $${gpu_name:-unknown} $${compute_cap:-unknown}" >&2
          exit 1
        fi
        if (( dflash )); then
          args+=(--speculative-config '{"method": "dflash", "model": "nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-BF16-DFlash-NVFP4", "num_speculative_tokens": 7}')
        fi

        total="$$(nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits | head -n1 | tr -d ' ')"
        free="$$(nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits | head -n1 | tr -d ' ')"
        if ! [[ "$${total}" =~ ^[0-9]+$$ ]]; then
          total="$$(awk '/MemTotal/ {printf "%d", $$2/1024}' /proc/meminfo)"
        fi
        if ! [[ "$${free}" =~ ^[0-9]+$$ ]]; then
          free="$$(awk '/MemAvailable/ {printf "%d", $$2/1024}' /proc/meminfo)"
        fi
        if (( unified )); then
          avail_mib=$$(( $$(awk '/MemAvailable/ {print $$2}' /proc/meminfo) / 1024 ))
          (( avail_mib < free )) && free=$${avail_mib}
        fi
        headroom="$${VLLM_VRAM_HEADROOM_MIB:-4096}"
        safe=$$((free > headroom ? free - headroom : 0))
        if (( safe < 24576 )); then
          echo "Not enough free memory for Bolt E4B (need >= 24GiB after $${headroom}MiB headroom, free=$${free}MiB)." >&2
          exit 1
        fi
        util="$${VLLM_GPU_MEMORY_UTILIZATION:-$$(awk -v s="$${safe}" -v t="$${total}" -v m="$${max_util}" 'BEGIN { u=s/t; if (u>m+0) u=m+0; printf "%.2f", u }')}"
        echo "Bolt E4B VRAM plan: $${free}MiB free / $${total}MiB total -> --gpu-memory-utilization $${util}"
        args+=(--gpu-memory-utilization "$${util}")

        # The model card serves Bolt E4B with its repo chat_template.jinja passed explicitly.
        chat_tpl="$$(python3 -c "from huggingface_hub import hf_hub_download; print(hf_hub_download('$${model}', 'chat_template.jinja'))")"
        args+=(--chat-template "$${chat_tpl}")

        cd /app/src
        exec python3 -m examples.shared.vllm_streaming_input.server "$${model}" "$${args[@]}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 1800s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
