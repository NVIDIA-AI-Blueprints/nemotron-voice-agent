x-magpie-multilingual-tts-service: &magpie-multilingual-tts-service-base
    image: nvcr.io/nim/nvidia/magpie-tts-multilingual:1.10.0
    user: "0:0"
    ports:
      - "50151:50051"
      - "9000:9000"
    volumes:
      - tts_cache:/opt/nim/.cache
    shm_size: 16GB
    ulimits:
      nofile: 2048
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import json, urllib.request; data=json.load(urllib.request.urlopen(\"http://127.0.0.1:9000/v1/health/ready\", timeout=5)); raise SystemExit(0 if data.get(\"status\") == \"ready\" or data.get(\"ready\") is True else 1)'"]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 3000s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

x-magpie-multilingual-tts-service-env: &magpie-multilingual-tts-service-env
  NGC_API_KEY: ${NVIDIA_API_KEY:-not-needed}
  NIM_HTTP_API_PORT: "9000"
  NIM_GRPC_API_PORT: "50051"

services:
  magpie-multilingual-tts-service:
    <<: *magpie-multilingual-tts-service-base
    profiles:
      - generic-assistant/server
      - multilingual-assistant/server
      - omni-assistant/server
      - omni-assistant-subagents/server
      - frontend-backend-agent/server
      - webex-byova-assistant/server
    environment:
      <<: *magpie-multilingual-tts-service-env
      NIM_TAGS_SELECTOR: name=magpie-tts-multilingual,batch_size=8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  magpie-multilingual-tts-service-perf:
    <<: *magpie-multilingual-tts-service-base
    profiles:
      - generic-assistant/server-perf
    environment:
      <<: *magpie-multilingual-tts-service-env
      NIM_TAGS_SELECTOR: name=magpie-tts-multilingual,batch_size=64
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    networks:
      default:
        aliases:
          - magpie-multilingual-tts-service

volumes:
  tts_cache:
