# Nemotron 3.5 Transcribe: alternate to streaming ASR.
#
# Opt-in alternate for Generic Assistant. It publishes host port 9002:
#   docker compose --profile generic-assistant/server --profile transcribe-asr up -d
# Then pick nemotron-transcribe in the Services tab.

services:
  nemotron-transcribe:
    image: nvcr.io/nim/nvidia/nemotron-transcribe:1.0.0
    profiles:
      - transcribe-asr
    user: "0:0"
    ipc: host
    environment:
      NGC_API_KEY: ${NVIDIA_API_KEY:-not-needed}
      ASR_MULTI_TURN: "off"
      NIM_TAGS_SELECTOR: concurrency=low
    ports:
      - "9002:9000"
    volumes:
      - transcribe_cache:/opt/nim/.cache
    ulimits:
      nofile: 2048
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import json, urllib.request; data=json.load(urllib.request.urlopen(\"http://127.0.0.1:9000/v1/health/ready\", timeout=5)); raise SystemExit(0 if data.get(\"status\") == \"ready\" or data.get(\"ready\") is True else 1)'"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 2400s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Opt-in NeMo-Speech.cpp service for Generic and Multilingual single-GPU recipes.
  nemotron-transcribe-single-gpu:
    image: ${NEMO_SPEECH_TRANSCRIBE_IMAGE:-nvcr.io/nvidia/nemo-speech.cpp:0.2.0}
    profiles:
      - transcribe-asr-single-gpu
    command:
      - serve
      - --asr-model
      - /models/transcribe.gguf
      - --host
      - 0.0.0.0
      - --port
      - "9000"
      - --no-ui
      - --asr.model.name
      - nvidia-nemotron-3p5-transcribe
    ports:
      - "9002:9000"
    volumes:
      - type: bind
        source: ${TRANSCRIBE_MODEL_LOC:-../../models/transcribe}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    networks:
      default:
        aliases:
          - nemotron-transcribe
    healthcheck:
      test: ["CMD", "/opt/nemo-speech/bin/nemo-speech", "health", "--url", "http://127.0.0.1:9000/ready", "--quiet"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  transcribe_cache:
