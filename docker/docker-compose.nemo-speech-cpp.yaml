x-nemo-speech: &nemo-speech
  image: nvcr.io/nvidia/nemo-speech.cpp:0.2.0
  entrypoint: /opt/nemo-speech/bin/riva_server
  ipc: host
  volumes:
    - ${NEMO_SPEECH_MODEL_LOC:-../models/nemo-speech}:/models:ro
  tmpfs:
    - /tmp:mode=1777
  ports:
    - "50051:50051"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["0"]
            capabilities: [gpu]
  restart: unless-stopped

services:
  nemo-speech:
    <<: *nemo-speech
    # Diarization needs the asr/, diarization/, and vad/ models from
    # scripts/download-nemo-speech-models.sh.
    profiles:
      - generic-assistant/single-gpu
    environment:
      NEMO_SPEECH_ASR_DIAR_MODEL_PATH: /models/diarization/Nemotron-3-Diarization.q8_0.gguf
      NEMO_SPEECH_ASR_DIAR_PRESET: v3-streaming
      NEMO_SPEECH_ASR_VAD_MODEL_PATH: /models/vad/silero-v6.2.0.gguf
      NEMO_SPEECH_ASR_VAD_MASKER_MASK_ENABLE: "true"
      NEMO_SPEECH_ASR_ENDPOINTING_VAD_BASED: "true"
    command:
      - --asr.model.path=/models/asr/nemotron-speech-streaming-en-0.6b.q8_0.gguf
      - --asr.backend.gpu=0
      - --asr.endpointing.enable=${NEMO_SPEECH_ASR_ENDPOINTING:-true}
      - --asr.endpointing.stop_history_eou_ms=${NEMO_SPEECH_ASR_STOP_HISTORY_EOU_MS:-320}
      - --tts.magpie-model=/models/magpie-tts/magpie_tts_multilingual_357m.v2607.f16.gguf
      - --tts.codec-model=/models/nano-codec/nemo_nano_codec_22khz_1.89kbps_21.5fps.decoder.f16.gguf
      - --tts.tokenizer-model-dir=/models/magpie-tts/extracted
      - --tts.tn-model-dir=/models/tn_configs
      - --tts.language-code=en-US
      - --tts.voice-name=John
      - --tts.threads=${NEMO_SPEECH_TTS_THREADS:-8}
      - --bind=0.0.0.0:50051

  nemo-speech-frontend-backend:
    <<: *nemo-speech
    profiles: [frontend-backend-agent/single-gpu]
    command:
      - --asr.model.path=/models/nemotron-speech-streaming-en-0.6b.q8_0.gguf
      - --asr.backend.gpu=0
      - --asr.endpointing.enable=${NEMO_SPEECH_ASR_ENDPOINTING:-true}
      - --asr.endpointing.stop_history_eou_ms=${NEMO_SPEECH_ASR_STOP_HISTORY_EOU_MS:-320}
      - --tts.magpie-model=/models/magpie-tts/magpie_tts_multilingual_357m.v2607.f16.gguf
      - --tts.codec-model=/models/nano-codec/nemo_nano_codec_22khz_1.89kbps_21.5fps.decoder.f16.gguf
      - --tts.tokenizer-model-dir=/models/magpie-tts/extracted
      - --tts.tn-model-dir=/models/tn_configs
      - --tts.language-code=en-US
      - --tts.voice-name=John
      - --tts.threads=${NEMO_SPEECH_TTS_THREADS:-8}
      - --bind=0.0.0.0:50051
    networks:
      default:
        aliases:
          - nemo-speech

  nemo-speech-multilingual:
    <<: *nemo-speech
    profiles: [multilingual-assistant/single-gpu]
    command:
      - --asr.model.path=/models/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf
      - --asr.backend.gpu=0
      - --asr.endpointing.enable=${NEMO_SPEECH_ASR_ENDPOINTING:-true}
      - --asr.endpointing.stop_history_eou_ms=${NEMO_SPEECH_ASR_STOP_HISTORY_EOU_MS:-320}
      - --tts.magpie-model=/models/magpie-tts/magpie_tts_multilingual_357m.v2607.f16.gguf
      - --tts.codec-model=/models/nano-codec/nemo_nano_codec_22khz_1.89kbps_21.5fps.decoder.f16.gguf
      - --tts.tokenizer-model-dir=/models/magpie-tts/extracted
      - --tts.tn-model-dir=/models/tn_configs
      - --tts.language-code=en-US
      - --tts.voice-name=John
      - --tts.threads=${NEMO_SPEECH_TTS_THREADS:-8}
      - --bind=0.0.0.0:50051
    networks:
      default:
        aliases:
          - nemo-speech

  nemo-speech-tts:
    <<: *nemo-speech
    profiles:
      - omni-assistant/single-gpu
      - omni-assistant-subagents/single-gpu
    command:
      - --tts.magpie-model=/models/magpie-tts/magpie_tts_multilingual_357m.v2607.f16.gguf
      - --tts.codec-model=/models/nano-codec/nemo_nano_codec_22khz_1.89kbps_21.5fps.decoder.f16.gguf
      - --tts.tokenizer-model-dir=/models/magpie-tts/extracted
      - --tts.tn-model-dir=/models/tn_configs
      - --tts.language-code=en-US
      - --tts.voice-name=John
      - --tts.threads=${NEMO_SPEECH_TTS_THREADS:-8}
      - --bind=0.0.0.0:50051
    networks:
      default:
        aliases:
          - nemo-speech
