#
# The LLM backend of the Frontend Delegation Hermes agent (FDH_BACKEND=llm): a lightweight OpenAI-SDK
# tool loop that runs inside the voice container, instead of Hermes in the `fdh-hermes` service. One
# container besides speech: the Hermes and OpenShell services do not start, and nothing waits for them.
# The gateway's settings and prompts are the Hermes ones (config/gateway.yaml, or gateway.eval.yaml with
# the eval overlay), except that each backend reads its own prompt file, config/prompts/<profile>/backend/llm.yaml.
# Needs Compose 2.24.4+ (!override, !reset).
#
#   docker compose -f docker-compose.yml -f docker/docker-compose.fdh-llm.yaml \
#     --profile frontend-delegation-hermes-agent/single-gpu up -d --build
#   # eval mode: the eval overlay first, this file last
#   docker compose -f docker-compose.yml -f docker/docker-compose.fdh-eval.yaml \
#     -f docker/docker-compose.fdh-llm.yaml [-f docker/docker-compose.fdh-silent-frontend.yaml] \
#     --profile frontend-delegation-hermes-agent/single-gpu up -d --build
#
# Do not combine it with docker/docker-compose.fdh-hermes-plain.yaml (that file runs Hermes). It sets no
# FDH_GATEWAY_CONFIG: the voice service has gateway.yaml from docker-compose.yml and gateway.eval.yaml from
# the eval overlay, so the file order cannot swap them. Every value is a literal, as in docker-compose.yml.

services:
  # Not in the recipe profile, so they never start with this overlay.
  hermes-openshell-init:
    profiles: !override ["fdh-hermes-off"]
  hermes-openshell-gateway:
    profiles: !override ["fdh-hermes-off"]
  fdh-hermes:
    profiles: !override ["fdh-hermes-off"]
  fdh-hermes-image:
    profiles: !override ["fdh-hermes-off"]

  frontend-delegation-hermes-agent-single-gpu:
    depends_on: !reset {}
    environment:
      FDH_BACKEND: llm                           # backend.kind of config/gateway*.yaml
      FDH_BACKEND_LINK: in_process               # the gateway and the LLM worker run in this process
      # The backend model, as docker/fdh/gateway.env sets it for Hermes.
      BACKEND_LLM_MODEL: nvidia/nvidia/nemotron-3-ultra
      BACKEND_LLM_BASE_URL: https://inference-api.nvidia.com/v1
      # The gateway event log and the backend traces, at the paths the Hermes runtime uses (under logs/).
      FDH_GATEWAY_LOG: logs/fdh_gateway_events.pipecat.jsonl
      FDH_WORKER_LOG_DIR: logs/fdh_workers_pipecat
