#
# VoiceBench mode for the Frontend/Backend Agent: a silent frontend. Apply after the eval overlay:
#
#   docker compose -f docker-compose.yml -f docker/docker-compose.fba-eval.yaml \
#     -f docker/docker-compose.fba-voicebench.yaml \
#     --profile frontend-backend-agent/single-gpu up -d --build
#
# VoiceBench ends each case on the first response.done and scores its transcript only. The frontend's
# filler shares the answer's response, so it is logged (filler log) and never spoken. Direct answers
# are still spoken. Use it for single-turn benchmarks only, never for Tau.

services:
  frontend-backend-agent-single-gpu:
    environment:
      FBA_FILLER_MODE: log_only
