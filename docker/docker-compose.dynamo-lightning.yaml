# Nemotron 3.5 Lightning served by NVIDIA Dynamo for the Generic and
# Multilingual Assistants. The `dynamo-frontend` service serves chat
# completions on `http://dynamo-frontend:8000/v1` and OpenAI Realtime text
# sessions on `ws://dynamo-frontend:8000/v1/realtime`, and routes them to the
# vLLM workers. Workers find the frontend through file-based discovery on the
# shared `dynamo_kv` volume, so no etcd or NATS is needed on one host.
# `dynamo-lightning-worker` shares GPU 0 with the ASR and TTS NIMs. Add more
# workers as described in docs/how-to/configure-llm.md.
x-dynamo: &dynamo
  image: nemotron-voice-agent-dynamo-vllm:1.7.0.dev20261110
  profiles:
    - generic-assistant/dynamo
    - multilingual-assistant/dynamo
  env_file:
    - ../.env
  environment: &dynamo-env
    DYN_DISCOVERY_BACKEND: file
    DYN_FILE_KV: /dynamo_kv
    DYN_REQUEST_PLANE: tcp
  volumes:
    - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    - dynamo_kv:/dynamo_kv
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

services:
  dynamo-frontend:
    <<: *dynamo
    build:
      context: dynamo
    pull_policy: build
    entrypoint: ["python3", "-m", "dynamo.frontend"]
    command: ["--http-port", "8000", "--router-mode", "round-robin", "--migration-limit", "2"]
    ports:
      - "18005:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models/nvidia/nemotron-3.5-lightning-30b-a3b/ready || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 1200s

  dynamo-lightning-worker:
    <<: *dynamo
    pull_policy: never
    shm_size: 16GB
    environment:
      <<: *dynamo-env
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      GPU_MEMORY_UTILIZATION: "0.45"
      MAX_NUM_SEQS: "256"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        args=(
          --served-model-name nvidia/nemotron-3.5-lightning-30b-a3b
          --endpoint-types chat,realtime
          --dyn-tool-call-parser qwen3_coder
          --dyn-reasoning-parser nemotron_v3
          --reasoning-parser nemotron_v3
          --dyn-default-thinking-mode disabled
          --max-model-len 32768
          --max-num-seqs "$${MAX_NUM_SEQS}"
          --trust-remote-code
          --enable-prefix-caching
          --mamba-backend flashinfer
          --mamba-cache-mode align
          --gpu-memory-utilization "$${GPU_MEMORY_UTILIZATION}"
        )

        compute_cap="$$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader 2>/dev/null | head -n1)"
        compute_major="$${compute_cap%%.*}"
        compute_minor="$${compute_cap#*.}"
        model=nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4

        if [[ "$${compute_major}" =~ ^[0-9]+$ ]] && (( compute_major >= 10 )); then
          echo "LLM recipe: Blackwell workstation / NVFP4"
          args+=(--moe-backend marlin --kv-cache-dtype fp8 --async-scheduling)
        elif [[ "$${compute_major}" == "9" ]] ||
             [[ "$${compute_major}" == "8" && "$${compute_minor}" =~ ^[0-9]+$ && "$${compute_minor}" -ge 9 ]]; then
          echo "LLM recipe: Hopper/Ada workstation / NVFP4 W4A16 via Marlin"
          args+=(--quantization modelopt_fp4 --moe-backend marlin --kv-cache-dtype fp8 --async-scheduling)
        else
          echo "Unsupported GPU compute capability for the Dynamo recipe: $${compute_cap:-unknown}" >&2
          exit 1
        fi

        exec python3 -m dynamo.vllm --model "$${model}" "$${args[@]}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

volumes:
  dynamo_kv:
