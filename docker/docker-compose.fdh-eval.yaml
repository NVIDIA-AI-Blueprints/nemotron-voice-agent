#
# Eval mode for the Frontend Delegation Hermes agent: the `eval` profile. Apply on top of the
# frontend-delegation-hermes-agent/single-gpu recipe for evaluation runs:
#
#   docker compose -f docker-compose.yml -f docker/docker-compose.fdh-eval.yaml \
#     --profile frontend-delegation-hermes-agent/single-gpu up -d --build
#
# It names only the voice service and `fdh-hermes`, and on `fdh-hermes` it sets only `environment`
# keys (each one also listed in docker/fdh/gateway.env), so it works the same way with any Hermes
# runtime and in any file order. Relative paths resolve from the repository root.

services:
  frontend-delegation-hermes-agent-single-gpu:
    environment:
      # OpenAI Realtime sessions only: browser UI sessions are refused, so they cannot take
      # resources from an evaluation run. Realtime sessions use the `eval` settings in every profile.
      FDH_PROFILE: eval
      # Plain HTTP and ws://, so the evaluation client connects without TLS.
      PIPELINE_TLS: "false"
      # Evaluation runs default to the customer_service prompt profile; FDH_PROMPT_PROFILE overrides it.
      FDH_PROMPT_PROFILE: ${FDH_PROMPT_PROFILE:-customer_service}

  fdh-hermes:
    environment:
      # The evaluation backend settings (it extends gateway.yaml; backend traces on).
      FDH_GATEWAY_CONFIG: gateway.eval.yaml
      FDH_PROMPT_PROFILE: ${FDH_PROMPT_PROFILE:-customer_service}   # the same profile as the voice service
