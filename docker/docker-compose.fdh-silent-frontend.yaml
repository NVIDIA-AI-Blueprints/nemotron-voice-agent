#
# Silent frontend for the Frontend Delegation Hermes agent, for single-turn evaluations. Apply after
# the eval overlay (and after the plain runtime overlay, when used):
#
#   docker compose -f docker-compose.yml -f docker/docker-compose.fdh-eval.yaml \
#     -f docker/docker-compose.fdh-silent-frontend.yaml \
#     --profile frontend-delegation-hermes-agent/single-gpu up -d --build
#
# A single-turn evaluation ends each case on the first response.done and scores its transcript only.
# Each FDH filler and proactive status line is its own response, so both are logged and never spoken.
# Direct answers are still spoken, and a turn the frontend leaves silent that holds a request is
# delegated. Use it for single-turn evaluations only, never for multi-turn ones such as Tau.
# Pick the prompt profile with FDH_PROMPT_PROFILE (for example general_qa).

services:
  frontend-delegation-hermes-agent-single-gpu:
    environment:
      FDH_SILENT_FRONTEND: "true"
