#
# VoiceBench mode for the Frontend Delegation Hermes agent: a silent frontend. Apply after the eval
# overlay (and after the plain runtime overlay, when used):
#
#   docker compose -f docker-compose.yml -f docker/docker-compose.fdh-eval.yaml \
#     -f docker/docker-compose.fdh-voicebench.yaml \
#     --profile frontend-delegation-hermes-agent/single-gpu up -d --build
#
# VoiceBench ends each case on the first response.done and scores its transcript only. Each FDH filler
# and proactive status line is its own response, so both are logged and never spoken. Direct answers
# are still spoken. Use it for single-turn benchmarks only, never for Tau.

services:
  frontend-delegation-hermes-agent-single-gpu:
    environment:
      FDH_SILENT_FRONTEND: "true"
