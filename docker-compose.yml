name: nemotron-voice-agent

# Compose deployments are recipe-based. Every profile is a complete,
# self-contained deployment recipe so users never have to AND two
# profiles together.
#
#   <example>                  cloud-only models
#   <example>/<hardware>       on-prem models with local sidecars
#
# Examples:
#   generic-assistant            Cascaded ASR + LLM + TTS Pipeline (Generic Assistant)
#   multilingual-assistant       Cascaded Multilingual ASR + LLM + TTS Pipeline (Multilingual Assistant)
#   omni-assistant               Cascaded Omni LLM + TTS Pipeline (Omni Assistant)
#   omni-assistant-subagents     Cascaded Omni LLM + TTS Pipeline (Omni Assistant Subagents)
#   frontend-backend-agent       Cascaded Frontend/Backend agent with the frontend barge-in
#                                        verdict (browser UI and OpenAI Realtime; Inference Hub LLMs)
#   frontend-delegation-hermes-agent     Cascaded frontend that delegates to a Hermes backend agent in
#                                        its own container (browser UI and OpenAI Realtime; single-gpu)
#
# Hardware targets:
#   server                    NIM ASR + LLM + TTS. Recommended for scaling
#                             on workstation / server GPUs.
#   single-gpu                One GPU (workstation, DGX Spark, or Jetson Thor)
#                             running the NeMo-Speech.cpp speech stack alongside vLLM
#
# Cloud-only recipes:
#   docker compose --profile generic-assistant up
#   docker compose --profile multilingual-assistant up
#   docker compose --profile omni-assistant up
#   docker compose --profile omni-assistant-subagents up
#   docker compose --profile frontend-backend-agent up
#
# On-prem recipes:
#   docker compose --profile generic-assistant/server up
#   docker compose --profile generic-assistant/server-perf up
#   docker compose --profile generic-assistant/single-gpu up
#   docker compose --profile multilingual-assistant/server up
#   docker compose --profile multilingual-assistant/single-gpu up
#   docker compose --profile omni-assistant/server up
#   docker compose --profile omni-assistant/single-gpu up
#   docker compose --profile omni-assistant-subagents/server up
#   docker compose --profile omni-assistant-subagents/single-gpu up
#   docker compose --profile frontend-backend-agent/server up
#   docker compose --profile frontend-backend-agent/single-gpu up
#   docker compose --profile frontend-delegation-hermes-agent/single-gpu up --build
#
# Observability profiles compose orthogonally with any recipe:
#   docker compose --profile <recipe> --profile tracing up   # Phoenix OTel
#   docker compose --profile <recipe> --profile turn up      # coturn TURN

include:
  - path: docker/docker-compose.nemotron35-lightning-nim.yaml
  - path: docker/docker-compose.nemotron35-lightning.yaml
  - path: docker/docker-compose.nemotron3-super.yaml
  - path: docker/docker-compose.nemotron3-omni-nim.yaml
  - path: docker/docker-compose.nemotron-asr.yaml
  - path: docker/docker-compose.parakeet-asr.yaml
  - path: docker/docker-compose.magpie-tts.yaml
  - path: docker/docker-compose.chatterbox-tts.yaml
  - path: docker/docker-compose.magpie-zeroshot-tts.yaml
  - path: docker/docker-compose.nemotron3-omni.yaml
  - path: docker/docker-compose.nemo-speech-cpp.yaml
  - path: docker/docker-compose.coturn.yaml
  - path: docker/docker-compose.phoenix.yaml

x-app: &app-base
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: nemotron-voice-agent:latest
  command: ["uv", "run", "python", "src/server.py", "--host", "0.0.0.0"]
  ports:
    - "${PIPELINE_APP_PORT:-7860}:7860"
  env_file:
    - .env
  volumes:
    - ./src:/app/src:ro
    - ./examples_registry.yaml:/app/examples_registry.yaml:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD-SHELL", "curl -fk $$(test \"$$(printf %s \"$${PIPELINE_TLS:-true}\" | tr '[:upper:]' '[:lower:]')\" = true && echo https || echo http)://localhost:7860/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

x-app-env: &app-env
  APP_RUNTIME: container
  TRANSPORT_SELECTION: ${TRANSPORT_SELECTION:-}
  PIPELINE_TLS: ${PIPELINE_TLS:-true}
  REALTIME_SERVICE_PLATFORM: cloud

services:
  generic-assistant:
    <<: *app-base
    profiles:
      - generic-assistant
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-generic-assistant}
      LOCAL_SERVICES_ENABLED: "false"

  generic-assistant-server:
    <<: *app-base
    profiles:
      - generic-assistant/server
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-generic-assistant}
      REALTIME_SERVICE_PLATFORM: server

  generic-assistant-single-gpu:
    <<: *app-base
    profiles:
      - generic-assistant/single-gpu
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-generic-assistant}
      REALTIME_SERVICE_PLATFORM: singlegpu

  generic-assistant-server-perf:
    <<: *app-base
    profiles:
      - generic-assistant/server-perf
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: generic-assistant
      REALTIME_SERVICE_PLATFORM: server
      UVICORN_WORKERS: "200"
      PROMPT_FILE_PATH: ${PROMPT_FILE_PATH:-}
      PROMPT_SELECTOR: ${PROMPT_SELECTOR:-}
      USE_SILERO_VAD_TURN_DETECTION: "true"
      SILERO_VAD_STOP_SECS: "0.5"
      AUDIO_OUT_10MS_CHUNKS: "40"
      ENABLE_WELCOME_MESSAGE: "false"

  multilingual-assistant:
    <<: *app-base
    profiles:
      - multilingual-assistant
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-multilingual-assistant}
      LOCAL_SERVICES_ENABLED: "false"

  multilingual-assistant-server:
    <<: *app-base
    profiles:
      - multilingual-assistant/server
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-multilingual-assistant}
      REALTIME_SERVICE_PLATFORM: server

  multilingual-assistant-single-gpu:
    <<: *app-base
    profiles:
      - multilingual-assistant/single-gpu
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-multilingual-assistant}
      REALTIME_SERVICE_PLATFORM: singlegpu

  omni-assistant:
    <<: *app-base
    profiles:
      - omni-assistant
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant}
      LOCAL_SERVICES_ENABLED: "false"

  omni-assistant-server:
    <<: *app-base
    profiles:
      - omni-assistant/server
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant}
      REALTIME_SERVICE_PLATFORM: server

  omni-assistant-single-gpu:
    <<: *app-base
    profiles:
      - omni-assistant/single-gpu
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant}
      REALTIME_SERVICE_PLATFORM: singlegpu

  omni-assistant-subagents:
    <<: *app-base
    profiles:
      - omni-assistant-subagents
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant-subagents}
      LOCAL_SERVICES_ENABLED: "false"

  omni-assistant-subagents-server:
    <<: *app-base
    profiles:
      - omni-assistant-subagents/server
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant-subagents}
      REALTIME_SERVICE_PLATFORM: server

  omni-assistant-subagents-single-gpu:
    <<: *app-base
    profiles:
      - omni-assistant-subagents/single-gpu
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant-subagents}
      REALTIME_SERVICE_PLATFORM: singlegpu

  # The Frontend/Backend Agent (frontend barge-in verdict, backend history, identifier
  # normalization) on the shared Pipecat speech stack, for the browser UI (WebRTC or WebSocket)
  # and the OpenAI Realtime API. LLMs: Inference Hub (NVIDIA_API_KEY holds the Inference Hub
  # key). FBA_PROFILE has two values: `default` (unset: browser UI sessions are served) and
  # `eval` (evaluation runs: browser sessions are refused; set by docker/docker-compose.fba-eval.yaml,
  # single-gpu only). OpenAI Realtime sessions always use the `eval` agent settings. The
  # uvicorn WebSocket keepalive must be off (UVICORN_WS_PING_INTERVAL=0) on every FBA service:
  # Realtime sessions check that the server matches the `eval` profile.
  frontend-backend-agent:
    <<: *app-base
    profiles:
      - frontend-backend-agent
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-frontend-backend-agent}
      LOCAL_SERVICES_ENABLED: "false"
      FBA_PROFILE: ${FBA_PROFILE:-default}
      FBA_FILLER_MODE: speak
      UVICORN_WS_PING_INTERVAL: ${UVICORN_WS_PING_INTERVAL:-0}
      UVICORN_WS_PING_TIMEOUT: ${UVICORN_WS_PING_TIMEOUT:-20}

  frontend-backend-agent-server:
    <<: *app-base
    profiles:
      - frontend-backend-agent/server
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-frontend-backend-agent}
      REALTIME_SERVICE_PLATFORM: server
      FBA_PROFILE: ${FBA_PROFILE:-default}
      FBA_FILLER_MODE: speak
      UVICORN_WS_PING_INTERVAL: ${UVICORN_WS_PING_INTERVAL:-0}
      UVICORN_WS_PING_TIMEOUT: ${UVICORN_WS_PING_TIMEOUT:-20}

  frontend-backend-agent-single-gpu:
    <<: *app-base
    profiles:
      - frontend-backend-agent/single-gpu
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-frontend-backend-agent}
      REALTIME_SERVICE_PLATFORM: singlegpu
      FBA_PROFILE: ${FBA_PROFILE:-default}
      FBA_FILLER_MODE: speak
      UVICORN_WS_PING_INTERVAL: ${UVICORN_WS_PING_INTERVAL:-0}
      UVICORN_WS_PING_TIMEOUT: ${UVICORN_WS_PING_TIMEOUT:-20}

  # Frontend Delegation Hermes agent (src/examples/frontend_delegation_hermes), single-gpu only:
  # the voice side in the shared app container, and the Hermes runtime (the FDH gateway and its Hermes
  # workers, Python 3.14) behind the `fdh-hermes` service: by default an OpenShell sandbox (see the
  # OpenShell block below), or a plain container with docker/docker-compose.fdh-hermes-plain.yaml
  # (the baseline for A/B checks and debugging). The voice side reaches Hermes only through
  # FDH_BACKEND_URL and depends only on `fdh-hermes` being healthy. FDH_PROFILE has two values:
  # `default` (browser UI) and `eval` (OpenAI Realtime only; set with FDH_GATEWAY_CONFIG by
  # docker/docker-compose.fdh-eval.yaml). OpenAI Realtime sessions always use the `eval` settings.
  # Every FDH setting below is a literal: Compose fills ${...} from .env, so a stale .env value
  # could otherwise change an evaluation run. Only the overlays change them.
  frontend-delegation-hermes-agent-single-gpu:
    <<: *app-base
    profiles:
      - frontend-delegation-hermes-agent/single-gpu
    volumes:
      - ./src:/app/src:ro
      - ./examples_registry.yaml:/app/examples_registry.yaml:ro
      - ./logs:/app/logs
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: frontend-delegation-hermes-agent
      REALTIME_SERVICE_PLATFORM: singlegpu
      FDH_PROFILE: default
      FDH_MAX_SESSIONS: "4"
      FDH_BACKEND_DELAY_S: "5"
      FDH_PROACTIVE_AFTER_S: "15"
      FDH_EVENT_LOG: logs/fdh_voice_events.pipecat.jsonl
      FDH_PROMPTS: prompts.yaml
      FDH_SILENT_FRONTEND: "false"
      FRONTEND_LLM_MODEL: nvidia/nvidia/nemotron-3.5-lightning
      FRONTEND_LLM_BASE_URL: https://inference-api.nvidia.com/v1
      # The Hermes runtime's address (OpenShell: the gateway's routed host name; port 8080 is the
      # OpenShell gateway's). The plain overlay sets ws://fdh-hermes:8790/v1/backend.
      FDH_BACKEND_URL: ws://default--fdh-hermes.openshell.localhost:8080/v1/backend
      # The voice side's other catalog and log variables, at the values FDH ran with before.
      FBA_ASR_SERVER: ""
      FBA_TTS_SERVER: ""
      FBA_VOICE_EVENT_LOG: ""
      FBA_FILLER_LOG: ""
      FBA_VOICE_PROMPTS: prompts.voice.yaml
      FBA_BACKEND_HISTORY: "false"
      # τ² sends no pings and pauses for seconds: the server must not ping (Realtime sessions check it).
      UVICORN_WS_PING_INTERVAL: "0"
      UVICORN_WS_PING_TIMEOUT: "20"
    depends_on:
      fdh-hermes:
        condition: service_healthy

  # Builds the Hermes image (docker/Dockerfile.fdh), then exits. HERMES_AGENT_DIR: a clean checkout
  # of https://github.com/nousresearch/hermes-agent at the commit in docker/fdh/requirements.txt.
  fdh-hermes-image:
    image: nemotron-voice-agent-fdh:local
    build:
      context: .
      dockerfile: docker/Dockerfile.fdh
      additional_contexts:
        hermes: ${HERMES_AGENT_DIR:-../hermes-agent}
    profiles:
      - frontend-delegation-hermes-agent/single-gpu
    entrypoint: ["true"]
    restart: "no"

  # ---- FDH Hermes runtime: OpenShell (the default). Every OpenShell service is in this block, and its
  # files are in docker/fdh/openshell/ (one pinned release: docker/fdh/openshell/VERSION). The FDH gateway
  # and its Hermes workers run in the OpenShell sandbox "fdh-hermes" (FDH image, UID 1500, egress only to
  # the backend LLM host, a placeholder instead of the API key). The plain runtime (the baseline for A/B
  # checks and debugging) is the overlay docker/docker-compose.fdh-hermes-plain.yaml.
  # Host needs: Linux 6.2+ with Landlock, Docker Engine 28+, Compose 2.24.4+, host port 127.0.0.1:8080
  # free, and no other OpenShell gateway on the host (/var/lib/openshell is host-wide).

  # One-time: generates the OpenShell gateway's JWT keys (kept if present), then exits.
  hermes-openshell-init:
    image: ghcr.io/nvidia/openshell/gateway:0.1.5-pre.4@sha256:c7cf028241fbeeb9ee273efb2724776eb86107d00d06ed5ca437e6378078e389
    profiles:
      - frontend-delegation-hermes-agent/single-gpu
    user: "0"
    command: ["generate-certs", "--output-dir", "/var/lib/openshell/tls"]
    environment:
      HOME: /var/lib/openshell
    volumes:
      - &openshell-data
        type: bind
        source: /var/lib/openshell
        target: /var/lib/openshell
        bind:
          create_host_path: true
    restart: "no"

  # The OpenShell gateway: creates the sandbox through the host's Docker socket and routes
  # Host "default--fdh-hermes.openshell.localhost" to the sandbox's port 8790. The alias lets the voice
  # service reach it with FDH_BACKEND_URL, unchanged code. It runs no Hermes logic.
  hermes-openshell-gateway:
    image: ghcr.io/nvidia/openshell/gateway:0.1.5-pre.4@sha256:c7cf028241fbeeb9ee273efb2724776eb86107d00d06ed5ca437e6378078e389
    profiles:
      - frontend-delegation-hermes-agent/single-gpu
    # Clear the image's CMD (--bind-address ...), so gateway.toml owns every setting.
    command: []
    user: "0"
    depends_on:
      hermes-openshell-init:
        condition: service_completed_successfully
    ports:
      # The sandbox supervisors run on the host network and dial 127.0.0.1:8080: same port as the bind.
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path on the host and in the container: Docker mounts the supervisor binary from it.
      - *openshell-data
      - ./docker/fdh/openshell/gateway.toml:/etc/openshell/gateway.toml:ro
    environment:
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      OPENSHELL_DB_URL: "sqlite:/var/lib/openshell/gateway.db?mode=rwc"
      HOME: /var/lib/openshell
      XDG_DATA_HOME: /var/lib/openshell
    networks:
      default:
        aliases:
          - default--fdh-hermes.openshell.localhost
    restart: unless-stopped

  # The Hermes runtime contract service (healthy = the FDH gateway answers /health). Here: the controller
  # (docker/fdh/openshell/controller.sh, OpenShell CLI) that creates the sandbox, reports its health, and
  # on stop saves the sandbox's logs to logs/openshell/<time>/ and deletes it. Gateway settings come only
  # from docker/fdh/gateway.env and the eval overlay; .env supplies only NVIDIA_API_KEY, which goes to the
  # OpenShell provider, never into the sandbox.
  fdh-hermes:
    image: nemotron-voice-agent-fdh-openshell-cli:local
    build:
      context: .
      dockerfile: docker/fdh/openshell/Dockerfile.cli
      args:
        OPENSHELL_VERSION: v0.1.5-pre.4
        OPENSHELL_COMMIT: a4c848adbddd0b4732fd70ddcf8a563a5b1e9317
    profiles:
      - frontend-delegation-hermes-agent/single-gpu
    depends_on:
      hermes-openshell-gateway:
        condition: service_started
      fdh-hermes-image:
        condition: service_completed_successfully
    init: true
    env_file:
      - docker/fdh/gateway.env
      - docker/fdh/openshell/controller.env
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    volumes:
      - ./docker/fdh/openshell:/cfg:ro
      - ./docker/fdh/gateway.env:/cfg-env/gateway.env:ro
      - ./logs/openshell:/out
    # /cfg is read-only; do not rely on the exec bit.
    command: ["bash", "/cfg/controller.sh"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "-m", "5", "-H", "Host: default--fdh-hermes.openshell.localhost",
             "http://hermes-openshell-gateway:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    # Time to save the sandbox's logs and delete it.
    stop_grace_period: 60s
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
