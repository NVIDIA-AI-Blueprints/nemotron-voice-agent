name: nemotron-voice-agent

# Compose deployments are recipe-based. Every profile is a complete,
# self-contained deployment recipe so users never have to AND two
# profiles together.
#
#   <example>                  cloud-only models
#   <example>/<hardware>       on-prem models with local sidecars
#
# Examples:
#   generic-assistant            Cascaded ASR + LLM + TTS Pipeline (Generic Assistant)
#   multilingual-assistant       Cascaded Multilingual ASR + LLM + TTS Pipeline (Multilingual Assistant)
#   omni-assistant               Cascaded Omni LLM + TTS Pipeline (Omni Assistant)
#   omni-assistant-subagents     Cascaded Omni LLM + TTS Pipeline (Omni Assistant Subagents)
#   frontend-backend-agent               Cascaded Frontend/Backend Agent Pipeline (Airline Assistant)
#
# Hardware targets:
#   server                    NIM ASR + LLM + TTS. Recommended for scaling
#                             on workstation / server GPUs.
#   single-gpu                One GPU (workstation, DGX Spark, or Jetson Thor)
#                             running the NeMo-Speech.cpp speech stack alongside vLLM
#
# Cloud-only recipes:
#   docker compose --profile generic-assistant up
#   docker compose --profile multilingual-assistant up
#   docker compose --profile omni-assistant up
#   docker compose --profile omni-assistant-subagents up
#   docker compose --profile frontend-backend-agent up
#
# On-prem recipes:
#   docker compose --profile generic-assistant/server up
#   docker compose --profile generic-assistant/server-perf up
#   docker compose --profile generic-assistant/single-gpu up
#   docker compose --profile multilingual-assistant/server up
#   docker compose --profile multilingual-assistant/single-gpu up
#   docker compose --profile omni-assistant/server up
#   docker compose --profile omni-assistant/single-gpu up
#   docker compose --profile omni-assistant-subagents/server up
#   docker compose --profile omni-assistant-subagents/single-gpu up
#   docker compose --profile frontend-backend-agent/server up
#   docker compose --profile frontend-backend-agent/single-gpu up
#
# Observability profiles compose orthogonally with any recipe:
#   docker compose --profile <recipe> --profile tracing up   # Phoenix OTel
#   docker compose --profile <recipe> --profile turn up      # coturn TURN
#   docker compose --profile <recipe> --profile dreamer up   # offline post-processing

include:
  - path: docker/docker-compose.nemotron35-lightning-nim.yaml
  - path: docker/docker-compose.nemotron35-lightning.yaml
  - path: docker/docker-compose.nemotron3-super.yaml
  - path: docker/docker-compose.nemotron3-omni-nim.yaml
  - path: docker/docker-compose.nemotron-asr.yaml
  - path: docker/docker-compose.parakeet-asr.yaml
  - path: docker/docker-compose.magpie-tts.yaml
  - path: docker/docker-compose.chatterbox-tts.yaml
  - path: docker/docker-compose.magpie-zeroshot-tts.yaml
  - path: docker/docker-compose.nemotron3-omni.yaml
  - path: docker/docker-compose.nemo-speech-cpp.yaml
  - path: docker/docker-compose.coturn.yaml
  - path: docker/docker-compose.phoenix.yaml
  - path: docker/docker-compose.dreamer.yaml
  - path: src/examples/frontend_backend_agent/airline/database/docker-compose.yml

x-app: &app-base
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: nemotron-voice-agent:latest
  command: ["uv", "run", "python", "src/server.py", "--host", "0.0.0.0"]
  ports:
    - "${PIPELINE_APP_PORT:-7860}:7860"
  env_file:
    - .env
  volumes:
    - ./src:/app/src:ro
    - ./examples_registry.yaml:/app/examples_registry.yaml:ro
    # Recorded sessions (MONITORING_ENABLED=true): SQLite DB + audio/images.
    - ./data:/app/data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD-SHELL", "curl -fk $$(test \"$$(printf %s \"$${PIPELINE_TLS:-true}\" | tr '[:upper:]' '[:lower:]')\" = true && echo https || echo http)://localhost:7860/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

x-app-env: &app-env
  APP_RUNTIME: container
  TRANSPORT_SELECTION: ${TRANSPORT_SELECTION:-}
  PIPELINE_TLS: ${PIPELINE_TLS:-true}

# App services of the local recipes (`*/server`, `*/single-gpu`). They run next to the
# GPU services on the same host, so they get read-only GPU visibility: `nvidia-smi`
# for the session recorder's GPU load samples (MONITORING_ENABLED=true). The
# `utility` capability mounts no CUDA libraries and the app allocates no GPU memory.
# Cloud recipes keep `app-base`: they must start on hosts without an NVIDIA runtime.
x-app-local: &app-local
  <<: *app-base
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-app-local-env: &app-local-env
  <<: *app-env
  NVIDIA_DRIVER_CAPABILITIES: utility
  # Code revision stored with each recorded session (the container has no `.git`).
  # Pass it from the host: GIT_SHA=$(git rev-parse HEAD) docker compose ... up -d
  GIT_SHA: ${GIT_SHA:-}

services:
  generic-assistant:
    <<: *app-base
    profiles:
      - generic-assistant
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-generic-assistant}

  generic-assistant-server:
    <<: *app-local
    profiles:
      - generic-assistant/server
    environment:
      <<: *app-local-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-generic-assistant}

  generic-assistant-single-gpu:
    <<: *app-local
    profiles:
      - generic-assistant/single-gpu
    environment:
      <<: *app-local-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-generic-assistant}

  generic-assistant-server-perf:
    <<: *app-local
    profiles:
      - generic-assistant/server-perf
    environment:
      <<: *app-local-env
      EXAMPLE_SELECTION: generic-assistant
      UVICORN_WORKERS: "200"
      PROMPT_FILE_PATH: ${PROMPT_FILE_PATH:-}
      PROMPT_SELECTOR: ${PROMPT_SELECTOR:-}
      USE_SILERO_VAD_TURN_DETECTION: "true"
      SILERO_VAD_STOP_SECS: "0.5"
      AUDIO_OUT_10MS_CHUNKS: "40"
      ENABLE_WELCOME_MESSAGE: "false"

  multilingual-assistant:
    <<: *app-base
    profiles:
      - multilingual-assistant
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-multilingual-assistant}

  multilingual-assistant-server:
    <<: *app-local
    profiles:
      - multilingual-assistant/server
    environment:
      <<: *app-local-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-multilingual-assistant}

  multilingual-assistant-single-gpu:
    <<: *app-local
    profiles:
      - multilingual-assistant/single-gpu
    environment:
      <<: *app-local-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-multilingual-assistant}

  omni-assistant:
    <<: *app-base
    profiles:
      - omni-assistant
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant}

  omni-assistant-server:
    <<: *app-local
    profiles:
      - omni-assistant/server
    environment:
      <<: *app-local-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant}

  omni-assistant-single-gpu:
    <<: *app-local
    profiles:
      - omni-assistant/single-gpu
    environment:
      <<: *app-local-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant}

  omni-assistant-subagents:
    <<: *app-base
    profiles:
      - omni-assistant-subagents
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant-subagents}

  omni-assistant-subagents-server:
    <<: *app-local
    profiles:
      - omni-assistant-subagents/server
    environment:
      <<: *app-local-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant-subagents}

  omni-assistant-subagents-single-gpu:
    <<: *app-local
    profiles:
      - omni-assistant-subagents/single-gpu
    environment:
      <<: *app-local-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-omni-assistant-subagents}

  frontend-backend-agent:
    <<: *app-base
    profiles:
      - frontend-backend-agent
    environment:
      <<: *app-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-frontend-backend-agent}

  frontend-backend-agent-server:
    <<: *app-local
    profiles:
      - frontend-backend-agent/server
    environment:
      <<: *app-local-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-frontend-backend-agent}

  frontend-backend-agent-single-gpu:
    <<: *app-local
    profiles:
      - frontend-backend-agent/single-gpu
    environment:
      <<: *app-local-env
      EXAMPLE_SELECTION: ${EXAMPLE_SELECTION:-frontend-backend-agent}
      THINKER_TOOL_TIMEOUT_SECONDS: ${THINKER_TOOL_TIMEOUT_SECONDS:-90}
