name: generic_initial_greeting
user:
  modality: text
judge:
  modality: text
  eval:
    factory: examples.shared.nvidia_inference_judge.create_nvidia_inference_judge
    model: nvidia/google/gemma-4-31b-it
turns:
  - expect:
      - event: llm_started
        within_ms: 30000
      - event: response
        eval: "the reply is a friendly initial greeting from a helpful generic voice assistant"
        within_ms: 60000
