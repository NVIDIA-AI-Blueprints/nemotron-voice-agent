name: omni_basic_response
user:
  modality: text
judge:
  modality: text
  eval:
    factory: examples.shared.nvidia_inference_judge.create_nvidia_inference_judge
    model: nvidia/google/gemma-4-31b-it
turns:
  - expect:
      - event: response
        within_ms: 90000
  - user: "What is 2 plus 2? Reply with only the numeral."
    expect:
      - event: response
        eval: "the response correctly answers that 2 plus 2 equals 4"
        within_ms: 120000
