name: generic_flowershop_persona
user:
  modality: text
judge:
  modality: text
  eval:
    factory: examples.shared.nvidia_inference_judge.create_nvidia_inference_judge
    model: nvidia/google/gemma-4-31b-it
turns:
  - expect:
      - event: response
        eval: "the reply is a brief initial greeting from Flora or GreenForce Garden and offers to help"
        within_ms: 60000
  - user: I need flowers for an anniversary.
    expect:
      - event: response
        eval: "the reply stays in the GreenForce Garden flower shop persona and helps with anniversary flowers"
        within_ms: 60000
