name: multilingual_fixed_english_lock
user:
  modality: text
judge:
  modality: text
  eval:
    factory: examples.shared.nvidia_inference_judge.create_nvidia_inference_judge
    model: nvidia/google/gemma-4-31b-it
turns:
  - expect:
      - event: response
        within_ms: 90000
  - user: "Bonjour."
    expect:
      - event: response
        eval: "the reply is in English, greets the user, and does not switch into French"
        within_ms: 90000
