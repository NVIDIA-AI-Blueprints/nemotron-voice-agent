name: omni_uploaded_image_path
user: !include _audio_user_kokoro.yaml
judge: !include _audio_judge_moonshine.yaml
turns:
  - expect:
      - event: llm_response
        eval: "the reply is a brief friendly initial greeting from an NVIDIA voice assistant"
        within_ms: 120000
  - user: "Use the uploaded attachment image. Please inspect the uploaded image and summarize what the diagram shows."
    expect:
      - event: llm_started
        within_ms: 120000
      - event: tts_response
        eval: "the spoken reply clearly acknowledges the uploaded image and says the assistant will inspect, analyze, or summarize it"
        within_ms: 240000
      - event: llm_response
        eval: >-
          the reply describes concrete visual structure from the uploaded diagram,
          such as a left-to-right pipeline or workflow with connected processing
          stages, icons, or arrows, or identifies a labeled component such as WebRTC,
          WebSocket, turn taking, Nemotron Omni, chat history, Magpie TTS, or playout
          synchronization
        within_ms: 240000
