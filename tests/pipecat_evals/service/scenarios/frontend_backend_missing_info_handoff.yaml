name: frontend_backend_missing_info_handoff
user:
  modality: text
judge:
  modality: text
  eval:
    service: nvidia-inference-api
    factory: tests.pipecat_evals.service.nvidia_inference_judge.create_nvidia_inference_judge
    model: nvidia/google/gemma-4-31b-it
turns:
  - expect:
      - event: response
        within_ms: 90000
  - user: "I want to book a flight."
    expect:
      - event: function_call
        calls:
          - name: call_backend
        within_ms: 90000
      - event: response
        eval: "the reply asks for missing flight booking details such as origin, destination, and travel date"
        within_ms: 120000
  - user: "I want to fly from New York to Boston."
    expect:
      - event: function_call
        calls:
          - name: call_backend
        within_ms: 90000
      - event: response
        eval: "the reply asks only for the travel date and does not ask for airports, passenger details, seat preferences, or meal preferences"
        within_ms: 120000
