name: multilingual_initial_greeting
user:
  modality: text
judge:
  modality: text
  eval:
    factory: examples.shared.nvidia_inference_judge.create_nvidia_inference_judge
    model: nvidia/google/gemma-4-31b-it
turns:
  - expect:
      - event: llm_started
        within_ms: 45000
      - event: response
        eval: "the reply is a brief English initial greeting or offer to help"
        within_ms: 90000
