name: omni_latency_smoke
user:
  modality: text
judge:
  modality: text
  eval:
    service: nvidia-inference-api
    factory: examples.shared.nvidia_inference_judge.create_nvidia_inference_judge
    model: nvidia/google/gemma-4-31b-it
turns:
  - expect:
      - event: response
        within_ms: 90000
  - user: "Say ready."
    expect:
      - event: llm_started
        within_ms: 45000
      - event: response
        within_ms: 120000
