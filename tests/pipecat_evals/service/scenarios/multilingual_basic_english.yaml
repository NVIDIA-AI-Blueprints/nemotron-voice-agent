name: multilingual_basic_english
user:
  modality: text
judge:
  modality: text
  eval:
    factory: examples.shared.nvidia_inference_judge.create_nvidia_inference_judge
    model: nvidia/google/gemma-4-31b-it
turns:
  - expect:
      - event: response
        within_ms: 90000
  - user: "How do you greet someone in the morning?"
    expect:
      - event: response
        eval: "the reply is in English and answers that a common morning greeting is good morning"
        within_ms: 90000
