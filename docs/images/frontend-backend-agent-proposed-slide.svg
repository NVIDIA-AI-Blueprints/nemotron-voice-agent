<text x="642.3376" y="634" font-size="16" font-weight="bold" fill="#0b6bcb" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">NEW</text>
<rect x="790" y="600" width="1070" height="52" rx="12" fill="#2e8b57" fill-opacity="0.13" stroke="#1f7a4d" stroke-width="2.2"/>
<text x="812" y="634.28" font-size="23" font-weight="bold" fill="#14532d" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">The Thinker’s instructions</text>
