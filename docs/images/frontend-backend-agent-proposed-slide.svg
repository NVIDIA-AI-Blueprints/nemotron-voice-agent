<text x="62" y="586" font-size="23" font-weight="bold" fill="#14532d" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">What changes</text>
<text x="1858" y="586" font-size="21" font-weight="bold" fill="#0b6bcb" text-anchor="end" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">NEW — one place a tool is defined</text>
<rect x="70" y="600" width="620" height="230" rx="12" fill="#2e8b57" fill-opacity="0.16" stroke="#1f7a4d" stroke-width="2.2"/>
<text x="90" y="643.44" font-size="27" font-weight="bold" fill="#14532d" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">ToolSpec — one entry per tool</text>
<text x="90" y="675.44" font-size="20" font-weight="normal" fill="#33403a" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">· its name</text>
<text x="90" y="704.44" font-size="20" font-weight="normal" fill="#33403a" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">· one line saying what it does</text>
<text x="90" y="733.44" font-size="20" font-weight="normal" fill="#33403a" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">· the inputs it needs</text>
<text x="90" y="762.44" font-size="20" font-weight="normal" fill="#33403a" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">· how to run it</text>
<text x="90" y="791.44" font-size="20" font-weight="normal" fill="#33403a" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">· how to say the answer</text>
