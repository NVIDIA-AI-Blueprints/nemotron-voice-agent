<text x="1010" y="995.16" font-size="19" font-weight="normal" fill="#33403a" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">  thinker_prompt: support_thinker</text>
<text x="1010" y="1023.16" font-size="19" font-weight="normal" fill="#33403a" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">  tools: [web_search, get_weather]</text>
<rect x="1698.496" y="906" width="147.50400000000002" height="30" rx="15" fill="#0b6bcb" fill-opacity="0.13" stroke="#0b6bcb" stroke-width="1.4"/>
<text x="1772.248" y="926" font-size="16" font-weight="bold" fill="#0b6bcb" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">no new Python</text>
<text x="60" y="1071" font-size="15" font-weight="normal" fill="#5b6b62" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">“No new Python” means: over tools that already exist. A genuinely new capability is still one Python function — a deliberate boundary, not a gap.</text>
