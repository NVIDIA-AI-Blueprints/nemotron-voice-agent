<rect x="1340" y="398" width="440" height="110" rx="12" fill="#2e8b57" fill-opacity="0.08" stroke="#1f7a4d" stroke-width="2.2"/>
<text x="1560.0" y="440.0" font-size="25" font-weight="bold" fill="#14532d" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">Tools run</text>
