<text x="1838" y="692.28" font-size="19" font-weight="normal" fill="#33403a" text-anchor="end" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">from the same entry, before anything runs</text>
<line x1="742" y1="684" x2="784" y2="684" stroke="#0b6bcb" stroke-width="2.6" marker-end="url(#arb)"/>
<rect x="790" y="716" width="1070" height="52" rx="12" fill="#2e8b57" fill-opacity="0.13" stroke="#1f7a4d" stroke-width="2.2"/>
<text x="812" y="750.28" font-size="23" font-weight="bold" fill="#14532d" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">Running the tool</text>
<text x="1838" y="750.28" font-size="19" font-weight="normal" fill="#33403a" text-anchor="end" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">its timeout, and what may run in parallel</text>
<line x1="742" y1="742" x2="784" y2="742" stroke="#0b6bcb" stroke-width="2.6" marker-end="url(#arb)"/>
<rect x="790" y="774" width="1070" height="52" rx="12" fill="#2e8b57" fill-opacity="0.13" stroke="#1f7a4d" stroke-width="2.2"/>
<text x="812" y="808.28" font-size="23" font-weight="bold" fill="#14532d" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">What it says back</text>
<text x="1838" y="808.28" font-size="19" font-weight="normal" fill="#33403a" text-anchor="end" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">including an honest “here’s what I can do”</text>
<line x1="742" y1="800" x2="784" y2="800" stroke="#0b6bcb" stroke-width="2.6" marker-end="url(#arb)"/>
<line x1="696" y1="715" x2="742" y2="715" stroke="#0b6bcb" stroke-width="2.6"/>
<line x1="742" y1="626" x2="742" y2="774" stroke="#0b6bcb" stroke-width="2.6"/>
<text x="950" y="868" font-size="19" font-weight="bold" fill="#0b6bcb" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">one entry feeds all four — so a tool can never be half-added, and turning one off really turns it off</text>
<rect x="60" y="892" width="900" height="158" rx="12" fill="#2e8b57" fill-opacity="0.16" stroke="#1f7a4d" stroke-width="2.2"/>
<text x="80" y="936.16" font-size="28" font-weight="bold" fill="#14532d" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">Adding a tool</text>
<text x="80" y="968.16" font-size="20" font-weight="normal" fill="#33403a" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">one entry (plus the API call, if it is new)</text>
<text x="80" y="997.16" font-size="20" font-weight="normal" fill="#33403a" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">no prompt edit · no plumbing edit · nothing to keep in sync</text>
