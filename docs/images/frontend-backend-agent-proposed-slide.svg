<text x="60" y="78" font-size="46" font-weight="bold" fill="#14532d" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">Proposed: one definition per tool   (design — not built)</text>
<text x="60" y="118" font-size="23" font-weight="normal" fill="#5b6b62" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">The voice pipeline does not change. What a tool is — and which tools an assistant has — becomes configuration.</text>
