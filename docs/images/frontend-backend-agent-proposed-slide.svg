<text x="62" y="386" font-size="23" font-weight="bold" fill="#14532d" text-anchor="start" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">Backend agent</text>
<text x="1858" y="386" font-size="21" font-weight="bold" fill="#7b8a82" text-anchor="end" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">UNCHANGED</text>
