# Editable service settings referenced by `settings: <profile>` in
# `services.yaml`. The UI renders one control per setting. The backend
# validates client values (type, `min`/`max`, `options`), falls back to the
# default, and writes the value at `path`: inside `extra_params` for LLM
# entries, or the entry field of that name for ASR and TTS entries.
# `path` defaults to the setting name. A setting without a default is sent only
# when the user sets it; otherwise the model's own default applies.
#
# Default precedence: the example's `settings` in `examples_registry.yaml`,
# then a value already at `path` in the entry, then `default`.
# A setting with `requires` is sent only while that setting is true.
# A setting with `below` stays at least `reserve` under that setting when it is
# set. When that leaves less than its `min`, its `requires` setting is turned off.
#
# Types: bool, int, float, enum (with `options`). Keys starting with `x-` are
# shared YAML anchors, not profiles.

x-llm: &llm
  temperature: &temperature
    label: "Temperature"
    type: float
    min: 0.0
    max: 1.0
  top_p:
    label: "Top P"
    type: float
    min: 0.01
    max: 1.0
  max_tokens:
    label: "Max Tokens"
    type: int
    min: 1
    max: 16384
  seed:
    label: "Seed"
    type: int
    min: 0
  enable_thinking:
    label: "Reasoning"
    type: bool
    default: false
    path: extra_body.chat_template_kwargs.enable_thinking

x-reasoning-budget: &reasoning-budget
  label: "Reasoning Budget"
  type: int
  default: 16384
  min: 128
  max: 32768
  requires: enable_thinking
  below: max_tokens
  reserve: 64

x-conversational-mode: &conversational-mode
  label: "Conversational Mode"
  type: bool
  default: true
  path: extra_body.chat_template_kwargs.conversational_mode

# Each serving engine names the budget differently: `nemotron-nim` sends
# `reasoning_budget`, `nemotron-vllm` sends `thinking_token_budget`.
nemotron-nim: &nim
  <<: *llm
  reasoning_budget:
    <<: *reasoning-budget
    path: extra_body.reasoning_budget

nemotron-vllm: &vllm
  <<: *llm
  reasoning_budget:
    <<: *reasoning-budget
    path: extra_body.thinking_token_budget

nemotron-omni-nim:
  <<: *nim
  temperature:
    <<: *temperature
    max: 2.0

nemotron-omni-vllm:
  <<: *vllm
  temperature:
    <<: *temperature
    max: 2.0

nemotron-bolt-4b:
  <<: *vllm
  conversational_mode: *conversational-mode

nemotron-bolt-4b-nvcf:
  <<: *nim
  conversational_mode: *conversational-mode

nemotron-super:
  <<: *llm

magpie-tts:
  synthesis_mode:
    label: "Synthesis Mode"
    type: enum
    options: [stitched, per_sentence]
    default: stitched

nemo-speech-asr:
  automatic_punctuation:
    label: "Punctuation"
    type: bool
    default: true
