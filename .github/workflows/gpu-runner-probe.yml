name: Probe GPU Runner

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Self-hosted runner label to inspect"
        required: true
        type: choice
        default: "arc-runners-org-nvidia-ai-bp-4-gpu"
        options:
          - "arc-runners-org-nvidia-ai-bp-4-gpu"
          - "arc-runners-org-nvidia-ai-bp-2-gpu"
          - "arc-runners-org-nvidia-ai-bp-1-gpu"

permissions: {}

jobs:
  probe:
    name: GPU inventory
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 10
    env:
      RUNNER_LABEL: ${{ inputs.runner_label }}
    steps:
      - name: Report runner and GPU inventory
        shell: bash
        run: |
          set -euo pipefail
          printf 'Requested runner label: %s\n' "$RUNNER_LABEL"
          uname -a
          docker version
          docker run --rm --gpus all nvidia/cuda:12.6.0-base-ubuntu22.04 bash -c "nvidia-smi -L"
          docker run --rm --gpus all nvidia/cuda:12.6.0-base-ubuntu22.04 bash -c \
            "nvidia-smi --query-gpu=index,name,uuid,memory.total,driver_version,compute_cap --format=csv,noheader"
          docker run --rm --gpus all nvidia/cuda:12.6.0-base-ubuntu22.04 bash -c "nvidia-smi topo -m"
