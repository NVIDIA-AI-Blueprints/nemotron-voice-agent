#
# Service-backed Pipecat evals. These use NVIDIA-hosted ASR/LLM/TTS services,
# an NVIDIA-hosted judge, a local Omni NIM server, and the local booking server.

name: Pipecat Service Evals

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Pipecat eval manifest to run"
        required: true
        default: "tests/pipecat_evals/service/cloud_tts_manifest.yaml"
      scenario:
        description: "Optional single scenario name"
        required: false
        default: ""
      timeout_seconds:
        description: "Per-scenario Pipecat timeout in seconds"
        required: true
        default: "360"
      retries:
        description: "Retries per scenario"
        required: true
        default: "2"
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipecat-service-evals:
    name: Pipecat service evals
    runs-on: arc-runners-org-nvidia-ai-bp-2-gpu
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 180

    env:
      PYTHONPATH: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Inspect runner
        run: |
          uname -a
          python --version
          uv --version
          docker version

      - name: Check GPU through Docker
        run: |
          docker run --rm --gpus all nvidia/cuda:12.6.0-base-ubuntu22.04 bash -c "nvidia-smi -L"
          docker run --rm --gpus all nvidia/cuda:12.6.0-base-ubuntu22.04 bash -c "nvidia-smi"

      - name: Validate NVIDIA API key
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_INFERENCE_API_KEY: ${{ secrets.NVIDIA_INFERENCE_API_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "NVIDIA_API_KEY repository secret is required for service-backed Pipecat evals."
            exit 1
          fi
          if [ -z "$NVIDIA_INFERENCE_API_KEY" ]; then
            echo "NVIDIA_INFERENCE_API_KEY repository secret is required for the NVIDIA-hosted evaluation judge."
            exit 1
          fi

      - name: Start local Omni NIM
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == '' || startsWith(inputs.scenario, 'omni_')
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          trap 'docker logout nvcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$NVIDIA_API_KEY" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          docker compose --profile omni-assistant-subagents/server up -d nvidia-llm-omni

      - name: Install dependencies
        run: uv sync --locked --group eval

      - name: Wait for local Omni NIM
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == '' || startsWith(inputs.scenario, 'omni_')
        run: |
          for attempt in {1..160}; do
            if curl -fsS http://127.0.0.1:18002/v1/health/ready >/dev/null 2>&1; then
              echo "Local Omni NIM is ready."
              exit 0
            fi
            container_id="$(docker compose ps -q nvidia-llm-omni)"
            if [ -z "$container_id" ] || ! docker inspect --format '{{.State.Running}}' "$container_id" 2>/dev/null | grep -qx true; then
              docker compose logs --no-color nvidia-llm-omni || true
              exit 1
            fi
            sleep 15
          done
          docker compose logs --no-color nvidia-llm-omni || true
          echo "Local Omni NIM did not become ready within 40 minutes."
          exit 1

      - name: Start booking backend
        run: |
          if curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1; then
            echo "A booking backend is already serving on localhost:8001; refusing to reuse a stale service."
            exit 1
          fi

          if python - <<'PY'
          import socket
          import sys

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
              sock.settimeout(1)
              sys.exit(0 if sock.connect_ex(("127.0.0.1", 8001)) == 0 else 1)
          PY
          then
            echo "Port 8001 is already in use before this workflow started the booking backend."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/booking-db"
          rm -f "$RUNNER_TEMP/booking-server.pid" "$RUNNER_TEMP/booking-server.starttime"
          BOOKING_DB_PATH="$RUNNER_TEMP/booking-db/bookings.db" \
            BOOKING_HOST=127.0.0.1 \
            BOOKING_PORT=8001 \
            nohup uv run --group eval python -m examples.frontend_backend_agent.airline.database.server \
            > "$RUNNER_TEMP/booking-server.log" 2>&1 &
          pid="$!"
          echo "$pid" > "$RUNNER_TEMP/booking-server.pid"
          awk '{print $22}' "/proc/$pid/stat" > "$RUNNER_TEMP/booking-server.starttime"

          for attempt in {1..60}; do
            current_starttime="$(awk '{print $22}' "/proc/$pid/stat" 2>/dev/null || true)"
            expected_starttime="$(cat "$RUNNER_TEMP/booking-server.starttime")"
            if [ "$current_starttime" != "$expected_starttime" ]; then
              cat "$RUNNER_TEMP/booking-server.log" || true
              exit 1
            fi

            if curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              cat "$RUNNER_TEMP/booking-server.log" || true
              exit 1
            fi
            sleep 2
          done

      - name: Run Pipecat service evals
        env:
          SERVICE_EVAL_MANIFEST: ${{ github.event.inputs.manifest || 'tests/pipecat_evals/service/cloud_tts_manifest.yaml' }}
          SERVICE_EVAL_SCENARIO: ${{ github.event.inputs.scenario || '' }}
          SERVICE_EVAL_TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '360' }}
          SERVICE_EVAL_RETRIES: ${{ github.event.inputs.retries || '2' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_INFERENCE_API_KEY: ${{ secrets.NVIDIA_INFERENCE_API_KEY }}
          NVIDIA_INFERENCE_API_BASE_URL: https://inference-api.nvidia.com/v1
        run: |
          args=(
            --manifest "$SERVICE_EVAL_MANIFEST"
            --timeout "$SERVICE_EVAL_TIMEOUT_SECONDS"
            --retries "$SERVICE_EVAL_RETRIES"
          )

          if [ -n "$SERVICE_EVAL_SCENARIO" ]; then
            args+=(--scenario "$SERVICE_EVAL_SCENARIO")
          fi

          uv run --group eval python tests/pipecat_evals/service/run_cloud_tts_evals.py "${args[@]}"

      - name: Collect local Omni NIM logs
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.scenario == '' || startsWith(inputs.scenario, 'omni_'))
        run: docker compose logs --no-color nvidia-llm-omni > "$RUNNER_TEMP/omni-nim.log" 2>&1 || true

      - name: Upload eval logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pipecat-service-eval-logs
          path: |
            eval-runs/
            ${{ runner.temp }}/booking-server.log
            ${{ runner.temp }}/omni-nim.log

      - name: Stop local Omni NIM
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.scenario == '' || startsWith(inputs.scenario, 'omni_'))
        run: docker compose --profile omni-assistant-subagents/server rm -f -s nvidia-llm-omni || true

      - name: Stop booking backend
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/booking-server.pid"
          starttime_file="$RUNNER_TEMP/booking-server.starttime"

          if [ ! -f "$pid_file" ] || [ ! -f "$starttime_file" ]; then
            rm -f "$pid_file" "$starttime_file"
            exit 0
          fi

          pid="$(cat "$pid_file")"
          expected_starttime="$(cat "$starttime_file")"
          rm -f "$pid_file" "$starttime_file"

          is_owned_process() {
            [ -n "$pid" ] || return 1
            current_starttime="$(awk '{print $22}' "/proc/$pid/stat" 2>/dev/null || true)"
            [ "$current_starttime" = "$expected_starttime" ]
          }

          is_owned_process || exit 0

          kill "$pid" || true
          for attempt in {1..10}; do
            if ! is_owned_process; then
              exit 0
            fi
            sleep 1
          done

          if is_owned_process; then
            kill -9 "$pid" || true
          fi
