#
# Lightweight CI: Python lint/format (ruff), Pipecat and LiveKit unit tests (pytest), and
# Pipecat client lint + build (eslint, tsc, vite). No deployment and no GPU are required.

name: Nemotron Voice Agent CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff lint
        run: uvx ruff@0.15.6 check .

      - name: Ruff format check
        run: uvx ruff@0.15.6 format --check .

  unit-tests:
    name: Pipecat unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest tests/unit/core tests/unit/sidecars tests/unit/pipecat tests/test_docs_review_receipt.py -v

  livekit-tests:
    name: LiveKit unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest tests/unit/livekit -v

  pipecat-evals:
    name: Pipecat eval smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --group eval

      - name: Validate eval transport wiring
        run: uv run --group eval python tests/evals/pipecat/ci/smoke.py

      - name: Run service-free eval suite
        run: uv run --group eval python -m pipecat.evals suite tests/evals/pipecat/ci/manifest.yaml --timeout 5 --name ci

  client-lint-build:
    name: Client lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/pipecat/package-lock.json

      - name: Install client dependencies
        run: npm --prefix clients/pipecat ci

      - name: Lint client
        run: npm --prefix clients/pipecat run lint

      - name: Build client
        run: npm --prefix clients/pipecat run build
