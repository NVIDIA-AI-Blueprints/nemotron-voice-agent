schema_version: voiceclaw.config.v3

server:
  host: 0.0.0.0
  port: 7860
  listener_security: private_network
  auth_mode: none
  max_sessions: 1

frontend_profiles:
  nvidia_hosted:
    kind: bundled_nva
    public_model: nvidia/voiceclaw
    realtime_model: nvidia/voiceclaw-cascade
    platform: cloud
    pipeline_mode: generic-assistant
    services:
      llm:
        id: nvidia-hosted-llm
        name: NVIDIA Hosted LLM
        provider: openai_compatible
        endpoint: ${VOICECLAW_LLM_ENDPOINT}
        model: nvidia/nemotron-3.5-lightning-30b-a3b
        credential:
          env: NVIDIA_API_KEY
        temperature: 0.0
        supports_tokenize: true
        realtime_max_output_tokens: 2048
        forced_tool_call_stops: ["</tool_call>"]
        extra_params:
          extra_body:
            chat_template_kwargs:
              enable_thinking: false
            repetition_penalty: 1.05
      asr:
        id: nvidia-hosted-asr
        name: NVIDIA Hosted Streaming ASR
        provider: nvidia_grpc
        endpoint: ${VOICECLAW_ASR_ENDPOINT}
        tls: true
        model: nemotron-asr-streaming
        credential:
          env: NVIDIA_API_KEY
      tts:
        id: nvidia-hosted-tts
        name: NVIDIA Hosted Magpie TTS
        provider: nvidia_grpc
        endpoint: ${VOICECLAW_TTS_ENDPOINT}
        tls: true
        model: magpie-tts-multilingual
        voice: John
        synthesis_mode: stitched
        credential:
          env: NVIDIA_API_KEY
    connect_timeout_seconds: 15
    bootstrap_timeout_seconds: 30
    max_event_bytes: 16777216

default_frontend: nvidia_hosted

model_contracts:
  profile: default

interaction_profiles: {}

backend_profiles:
  deployed_agent:
    kind: openshell_fabric
    interaction:
      profile: stateless
      tool_copy: {}
    credential:
      env: VOICECLAW_OPENSHELL_CLIENT_SECRET
    settings:
      endpoint: ${VOICECLAW_OPENSHELL_ENDPOINT}
      workspace: ${VOICECLAW_OPENSHELL_WORKSPACE}
      sandbox: ${VOICECLAW_OPENSHELL_SANDBOX}
      adapter_id: ${VOICECLAW_FABRIC_ADAPTER_ID}
      fabric_agent: ${VOICECLAW_FABRIC_AGENT}
      native_agent: ${VOICECLAW_NATIVE_AGENT}
      issuer: ${VOICECLAW_OPENSHELL_ISSUER}
      client_id: ${VOICECLAW_OPENSHELL_CLIENT_ID}
      scopes: [sandbox:write]
      rpc_timeout_seconds: 30
      invoke_timeout_seconds: 330
      result_speech_budget_bytes: 512

default_backend: deployed_agent

interaction:
  max_pending_speech: 32
  context_character_budget: 24000
  request_summary_character_limit: 512
  retained_request_limit: 8
  turn_routing_mode: model

state:
  kind: sqlite
  path: /var/lib/voiceclaw/state/state.db
