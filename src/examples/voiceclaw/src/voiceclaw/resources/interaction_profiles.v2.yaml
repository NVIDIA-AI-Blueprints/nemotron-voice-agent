schema_version: voiceclaw.interaction-profiles.v2

profiles:
  stateless:
    session_scope: none
    work_cardinality: many
    tools:
      conversation.respond:
        operations: []
        argument_binding: none
        description: >-
          Select this route only for a social or interactional turn with no Work objective, or for one
          necessary clarification before a faithful objective can be formed. Do not select it merely because
          a requested result could be compressed into short speech. This call selects a route only; emit no
          answer or routing reasoning.
        property_descriptions: {}
      work.delegate:
        operations: [work.submit]
        argument_binding: goal_required
        description: >-
          Select the configured target for every finalized user Work objective or requested deliverable.
          Supply a faithful, standalone goal that incorporates the relevant conversation; do not add
          unstated requirements. The server supplies correlation and routing identities.
        property_descriptions:
          goal: >-
            Complete standalone objective reconstructed from the relevant conversation, including the
            user's requested outcome and stated constraints without invented facts.
      work.cancel:
        operations: [work.cancel]
        argument_binding: work_id_required
        description: >-
          Cancel one identified VoiceClaw-local request only while it is still waiting for dispatch.
          This does not stop local speech and does not claim backend cancellation.
        property_descriptions:
          work_id: VoiceClaw-local Work identifier from the current runtime projection.
      work.status:
        operations: [work.status]
        argument_binding: work_id_optional
        description: >-
          Read VoiceClaw's current local evidence for one request, or the most recent request when
          omitted. This does not query or invent native backend status.
        property_descriptions:
          work_id: Optional VoiceClaw-local Work identifier from the current runtime projection.

  single_stateful:
    session_scope: attachment
    work_cardinality: single
    tools:
      conversation.respond:
        operations: []
        argument_binding: none
        description: >-
          Select this route only for a social or interactional turn with no Work objective, or for one
          necessary clarification before a faithful objective can be formed. Do not select it merely because
          a requested result could be compressed into short speech. This call selects a route only; emit no
          answer or routing reasoning.
        property_descriptions: {}
      work.delegate:
        operations: [work.submit, work.steer]
        argument_binding: goal_required
        description: >-
          Start or continue the sole active interaction with a faithful, standalone goal reconstructed
          from the relevant conversation. The server resolves new Work or steering from authoritative
          state and supplies every correlation identity.
        property_descriptions:
          goal: >-
            Complete standalone objective for submitting or steering the sole active interaction,
            preserving the user's stated constraints without inventing facts.
      work.answer_agent:
        operations: [work.answer_query, work.respond_permission]
        argument_binding: query_id_required
        description: Route the current finalized user response to one pending backend query.
        property_descriptions:
          query_id: Pending backend query identifier from the authoritative projection.
      work.cancel:
        operations: [work.cancel]
        argument_binding: none
        description: Request cancellation of the sole active Work item.
        property_descriptions: {}
      work.status:
        operations: [work.status]
        argument_binding: none
        description: Read authoritative status for the sole active Work item.
        property_descriptions: {}

  conductor:
    session_scope: attachment
    work_cardinality: many
    tools:
      conversation.respond:
        operations: []
        argument_binding: none
        description: >-
          Select this route only for a social or interactional turn with no Work objective, or for one
          necessary clarification before a faithful objective can be formed. Do not select it merely because
          a requested result could be compressed into short speech. This call selects a route only; emit no
          answer or routing reasoning.
        property_descriptions: {}
      work.delegate:
        operations: [work.submit, work.steer]
        argument_binding: goal_required
        description: >-
          Route a faithful, standalone goal reconstructed from the relevant conversation when the server
          can resolve one unambiguous submit or steer operation from authoritative state. Do not perform
          backend planning or invent requirements.
        property_descriptions:
          goal: >-
            Complete standalone objective for the selected interaction, including relevant prior context
            and stated constraints without invented facts.
      work.answer_agent:
        operations: [work.answer_query, work.respond_permission]
        argument_binding: query_id_required
        description: Route the current finalized user response to one pending backend query.
        property_descriptions:
          query_id: Pending backend query identifier from the authoritative projection.
      work.cancel:
        operations: [work.cancel]
        argument_binding: work_id_required
        description: Request cancellation of one identified Work item; this does not stop local speech.
        property_descriptions:
          work_id: Opaque backend-issued Work identifier from the authoritative projection.
      work.status:
        operations: [work.status]
        argument_binding: work_id_optional
        description: Read one Work item by ID, or the bounded current Work projection when omitted.
        property_descriptions:
          work_id: Opaque backend-issued Work identifier from the authoritative projection.

  specialized:
    session_scope: target
    work_cardinality: per_target
    tools:
      conversation.respond:
        operations: []
        argument_binding: none
        description: >-
          Select this route only for a social or interactional turn with no Work objective, or for one
          necessary clarification before a faithful objective can be formed. Do not select it merely because
          a requested result could be compressed into short speech. This call selects a route only; emit no
          answer or routing reasoning.
        property_descriptions: {}
      work.delegate:
        operations: [work.submit, work.steer]
        argument_binding: target_goal_required
        description: >-
          Start or continue one configured target interaction with a faithful, standalone goal. Keep the
          goal target-specific; do not create a cross-target plan or dependency graph.
        property_descriptions:
          agent: Stable configured target identifier.
          goal: >-
            Complete standalone objective for this target reconstructed from relevant conversation,
            constraints, and artifact references without invented facts.
      work.answer_agent:
        operations: [work.answer_query, work.respond_permission]
        argument_binding: query_id_required
        description: Route the current finalized user response to one pending backend query.
        property_descriptions:
          query_id: Pending backend query identifier from the authoritative projection.
      work.cancel:
        operations: [work.cancel]
        argument_binding: target_required
        description: Request cancellation for the selected target interaction.
        property_descriptions:
          agent: Stable configured target identifier.
      work.status:
        operations: [work.status]
        argument_binding: target_optional
        description: Read authoritative status for one target, or the bounded target overview when omitted.
        property_descriptions:
          agent: Stable configured target identifier.
