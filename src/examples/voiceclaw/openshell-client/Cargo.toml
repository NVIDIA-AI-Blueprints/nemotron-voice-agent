[package]
name = "voiceclaw-openshell-exec"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "BSD-2-Clause"

[dependencies]
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", rev = "5a7728c304b5528e954e9ae900cf21f84e1a12b1" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tonic = "0.14"
prost-types = "0.14"
url = "2"

[dev-dependencies]
h2 = "0.4"
http = "1"
