name: voiceclaw

services:
  voiceclaw:
    build:
      context: ../../..
      dockerfile: src/examples/voiceclaw/Dockerfile
      args:
        VOICECLAW_VERSION: ${VOICECLAW_VERSION:-0.1.0}
        VOICECLAW_SOURCE_REVISION: ${VOICECLAW_SOURCE_REVISION:-development}
        VOICECLAW_SOURCE_URL: ${VOICECLAW_SOURCE_URL:-https://github.com/NVIDIA-AI-Blueprints/nemotron-voice-agent}
    image: nemotron-voiceclaw:latest
    # This developer recipe opts into the optional UI. The image is headless
    # unless `--ui` is passed.
    command: ["serve", "--ui"]
    # Host networking lets the developer configuration reach host-local model
    # endpoints and a developer-local OpenShell API without publishing them.
    network_mode: host
    # The root supervisor may drop to its two fixed child identities, but no
    # child may regain privilege through a setuid/setgid or file-cap binary.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      VOICECLAW_CONFIG: /run/voiceclaw/config/voiceclaw.yaml
      VOICECLAW_FABRIC_ADAPTER_ID: ${VOICECLAW_FABRIC_ADAPTER_ID:-nvidia.fabric.openclaw}
      VOICECLAW_FABRIC_AGENT: ${VOICECLAW_FABRIC_AGENT:-main}
      VOICECLAW_NATIVE_AGENT: ${VOICECLAW_NATIVE_AGENT:-main}
      VOICECLAW_OPENSHELL_ENDPOINT: ${VOICECLAW_OPENSHELL_ENDPOINT:?Set connection.gatewayEndpoint URL}
      VOICECLAW_OPENSHELL_SANDBOX: ${VOICECLAW_OPENSHELL_SANDBOX:?Set the authored sandbox name}
      VOICECLAW_OPENSHELL_WORKSPACE: ${VOICECLAW_OPENSHELL_WORKSPACE:?Set the applied workspace}
      VOICECLAW_SERVER_HOST: ${VOICECLAW_SERVER_HOST:-127.0.0.1}
    group_add:
      - "${VOICECLAW_FILE_GID:-1000}"
    volumes:
      - type: bind
        source: ${VOICECLAW_CONFIG_FILE_HOST:-./src/voiceclaw/resources/voiceclaw.example.yaml}
        target: /run/voiceclaw/config/voiceclaw.yaml
        read_only: true
        bind:
          create_host_path: false
      # Provider credentials, optional remote OpenShell credentials, and
      # operator catalogs remain files in this read-only operator root.
      - type: bind
        source: ${VOICECLAW_OPERATOR_FILES_HOST:-./operator}
        target: /run/voiceclaw/operator
        read_only: true
        bind:
          create_host_path: false
      - voiceclaw-state:/var/lib/voiceclaw
      - voiceclaw-cache:/var/cache/voiceclaw
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

volumes:
  voiceclaw-state:
  voiceclaw-cache:
