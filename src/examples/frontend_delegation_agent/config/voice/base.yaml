#
# Voice-layer settings shared by every profile of the delegation prototype. This is a real
# voice-package profile (loaded with load_voice_config), so it extends the voice package's base.
# The text-agent "agent:" section it inherits is loaded but unused: this prototype replaces the
# text agent with the DelegationTurnManager (plan section 4.3).

extends: ../voice_agent.yaml

server:
  port: ${FDA_VOICE_PORT:-8775}
  max_sessions: ${FDA_MAX_SESSIONS:-8}
  # tau2 stops reading the socket for up to ~90 s at a time; a keepalive ping would close a healthy session.
  ws_ping_interval_s: 0

turn_detection:
  # V11: 800 ms end-of-turn silence for every client (tau2 sends 500, the browser page hard-codes 500).
  silence_duration_ms: 800
  honor_client_values: false

protocol:
  auto_response: true
  emit_usage: true

barge_in:
  enabled: true
  history: truncate_heard
  interruption_marker: " [interrupted by the user]"

logging:
  event_log: "${FDA_EVENT_LOG:-logs/fda_voice_events.jsonl}"

# V12: transcript normalization on by default (identifiers written for the agents only; the wire
# keeps the raw ASR text). Tool-argument normalization is set per profile (it needs client tools).
normalization:
  transcript:
    enabled: true
    case: lower
    frontend_note_key: identifier_note_voice
