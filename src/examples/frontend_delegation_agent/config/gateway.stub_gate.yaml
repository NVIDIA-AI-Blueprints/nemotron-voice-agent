#
# In-process emulator backend for the no-GPU eval gates: every run without a directive calls the
# session's first tool once, so the benchmark's Gate A sees a function-call round trip.

extends: gateway.emulator.yaml
workers:
  mode: in_process
  emulator_default_tool: true
