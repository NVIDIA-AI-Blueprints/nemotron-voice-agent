#
# Pipecat adapter, demo (the `default` profile: browser UI sessions): greeting, demo tools
# run in the voice server, and FDA_BACKEND_DELAY_S seconds (default 5) before each backend run so
# status questions and steering can be tried while the backend is WORKING. Pair with gateway.yaml
# and config/adapters/pipecat.yaml. Pipecat owns turn endings, so FDA's spelling hold is off.

extends: browser_demo.yaml

voice_profile: ../voice/pipecat_demo.yaml

delegation:
  spelling_hold: {enabled: false}
