#
# Pipecat adapter, evaluation by τ² (the `eval` profile: every OpenAI Realtime session runs it): the
# domain-agnostic realtime_eval.yaml with client-executed tools (tools.executor: wire) and the
# client's instructions as the policy. Pair with gateway.eval.yaml and config/adapters/pipecat.eval.yaml
# (0.8 s VAD silence in audio time). Pipecat owns turn endings, so FDA's spelling hold is off.

extends: realtime_eval.yaml

voice_profile: ../voice/pipecat_realtime_eval.yaml

delegation:
  spelling_hold: {enabled: false}
