# The lines the voice says word for word, by name (prompts/catalog.py: catalog_line), for every profile. The talker
# says ``holding`` when its decision fails while work is open; the cascade reads the others. An empty line means
# none is said.
lines:
  apology: "Sorry, I ran into a problem with that. Could you say it again?"
  unclear: "Something went wrong along the way, so I can't tell whether that went through. Let's check before trying it again."
  lost: "I lost track of that request. Could you say it again?"
  refusal: "I can't take on another request right now. Please try again in a moment."
  app_wait_line: "I'm still waiting for that to come through."
  holding: "One moment, I'm still working on your earlier request."
  intro: "This is an initial greeting, not an order. Greet the user briefly as Remy from Bluebird Cafe and ask what they would like. Respond directly with spoken text."
  greeting: "Hi, I'm Remy from Bluebird Cafe. What can I get you?"
