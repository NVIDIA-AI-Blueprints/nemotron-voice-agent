# The cafe profile: the Bluebird Cafe demo. Its talker, backend prompt and channel are the role files beside this one;
# this file holds its settings, never text a surface shows (the UI shows talker.yaml's description).

default: true                          # the profile a UI bot session gets when it names none
tools:                                 # the backend's server tool sources for this profile's UI bot sessions
  cafe: {}                             # the cafe's menu, cart and order tools (delegation_core/backend/tools/cafe)
