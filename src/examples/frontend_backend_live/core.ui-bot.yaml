# The delegation core of the repository UI bot: core.yaml, with what differs.
# config.yaml names this file under ui_bot.core_config. The bot adds the channel context that ui_bot.channel names
# after the backend prompt.

extends: core.yaml

delegation:
  result_format: speak_display         # a show item for the task cards, then the answer to speak

backend:
  prompt: cafe                         # agent_prompts.Backend in prompts.yaml
  tools:
    cafe: {}                           # the cafe's menu, cart and order tools
