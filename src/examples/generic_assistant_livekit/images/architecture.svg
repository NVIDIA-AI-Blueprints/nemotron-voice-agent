<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img" aria-labelledby="t d">
  <title id="t">LiveKit generic assistant architecture</title>
  <desc id="d">A browser joins a LiveKit server over WebRTC. The agent worker joins the same room and calls an ASR model, an LLM, and a TTS model, and runs weather and date tools. A UI server issues join tokens.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
  </defs>
  <rect width="960" height="420" fill="#fff"/>
  <g fill="#f4f4f4" stroke="#555" stroke-width="1.5">
    <rect x="30" y="40" width="190" height="90" rx="8"/>
    <rect x="30" y="250" width="190" height="90" rx="8"/>
    <rect x="300" y="145" width="190" height="100" rx="8"/>
  </g>
  <rect x="570" y="30" width="360" height="360" rx="10" fill="#f9fbf3" stroke="#76b900" stroke-width="2"/>
  <g fill="#fff" stroke="#76b900" stroke-width="1.5">
    <rect x="600" y="100" width="300" height="50" rx="6"/>
    <rect x="600" y="170" width="300" height="50" rx="6"/>
    <rect x="600" y="240" width="300" height="50" rx="6"/>
    <rect x="600" y="310" width="300" height="50" rx="6"/>
  </g>
  <g fill="#222" text-anchor="middle">
    <text x="125" y="80" font-weight="bold">Browser UI</text><text x="125" y="102">livekit-client, mic, transcript</text>
    <text x="125" y="290" font-weight="bold">UI server</text><text x="125" y="312">static files, /token</text>
    <text x="395" y="190" font-weight="bold">LiveKit server</text><text x="395" y="212">WebRTC room, data channel</text>
    <text x="750" y="58" font-weight="bold" font-size="16">Agent worker (LiveKit Agents)</text>
    <text x="750" y="82" font-size="12">Silero VAD, turn handling, tool calls</text>
    <text x="750" y="130">ASR model (gRPC, NVIDIA plugin)</text>
    <text x="750" y="200">LLM (OpenAI-compatible API)</text>
    <text x="750" y="270">TTS model (gRPC, NVIDIA plugin)</text>
    <text x="750" y="340">Tools for the selected use case</text>
  </g>
  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)" marker-start="url(#a)">
    <path d="M220 85 H260 V195 H300"/>
    <path d="M490 195 H570"/>
  </g>
  <g stroke="#555" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a)">
    <path d="M125 250 V130"/>
  </g>
  <g fill="#555" font-size="12">
    <text x="232" y="70">audio, events</text>
    <text x="500" y="186">room audio</text>
    <text x="135" y="195">join token</text>
  </g>
  <text x="480" y="405" text-anchor="middle" fill="#555" font-size="12">Not included: TURN, Redis, and SIP. The ASR, LLM, and TTS services run on NVIDIA Cloud or in local sidecars, depending on the profile.</text>
</svg>
