#
# On-prem service catalog for the Frontend/Backend Verdict example.
#
# LLM endpoints (model and base URL) come from the `llm` (frontend) entry the session
# selects (the browser UI's LLM menu, or the Realtime route's selector); the backend
# (`thinker-llm`) is the profile's. The request parameters (temperature, max_tokens, reasoning
# switches) are the profile's, from core/config/agent.yaml; the catalog values below repeat
# them. Both LLMs default to the NVIDIA Inference Hub; the API key is NVIDIA_API_KEY (an
# Inference Hub `sk-...` key).
#
# ASR and TTS are resolved by the example's own catalog loader (core/config/catalog.py) and
# handed to the shared Pipecat services: the `singlegpu` section for the single-GPU recipe
# (the NeMo-Speech.cpp sidecar, nemo-speech:50051) and the `server` section for the server
# recipe (the ASR and TTS NIM sidecars). FBA_ASR_SERVER / FBA_TTS_SERVER replace the server.
# `synthesis_mode` is required by the repository catalog rules; this example does not
# read it: its TTS mode comes from adapters/pipecat/settings (`per_sentence`, one request
# per sentence).

server:
  llm:
    nemotron-3.5-lightning:
      name: "Nemotron 3.5 Lightning frontend (Inference Hub, reasoning off)"
      model_id: "nvidia/nvidia/nemotron-3.5-lightning"
      base_url: "https://inference-api.nvidia.com/v1"
      system_prompt: ""
      max_tokens: 1024
      temperature: 0.0
      extra_params: '{"extra_body":{"chat_template_kwargs":{"enable_thinking":false}}}'
  thinker-llm:
    nemotron-3-ultra:
      name: "Nemotron 3 Ultra backend (Inference Hub, reasoning on)"
      model_id: "nvidia/nvidia/nemotron-3-ultra"
      base_url: "https://inference-api.nvidia.com/v1"
      max_tokens: 4096
      temperature: 0.0
      extra_params: '{"extra_body":{"chat_template_kwargs":{"enable_thinking":true},"reasoning_budget":1024}}'
  tts:
    magpie-multilingual-tts:
      name: "Magpie TTS"
      server: "magpie-multilingual-tts-service:50051"
      voice_id: "Magpie-Multilingual.EN-US.Aria"
      model: "magpie-tts-multilingual"
      function_id: ""
      synthesis_mode: stitched
  asr:
    nemotron-asr-streaming-english:
      name: "Nemotron ASR Streaming English"
      server: "nemotron-asr-streaming-english:50052"
      model: "cache-aware-parakeet-rnnt-multi-asr-streaming-sortformer"
      function_id: ""

singlegpu:
  llm:
    nemotron-3.5-lightning:
      name: "Nemotron 3.5 Lightning frontend (Inference Hub, reasoning off)"
      model_id: "nvidia/nvidia/nemotron-3.5-lightning"
      base_url: "https://inference-api.nvidia.com/v1"
      system_prompt: ""
      max_tokens: 1024
      temperature: 0.0
      extra_params: '{"extra_body":{"chat_template_kwargs":{"enable_thinking":false}}}'
  thinker-llm:
    nemotron-3-ultra:
      name: "Nemotron 3 Ultra backend (Inference Hub, reasoning on)"
      model_id: "nvidia/nvidia/nemotron-3-ultra"
      base_url: "https://inference-api.nvidia.com/v1"
      max_tokens: 4096
      temperature: 0.0
      extra_params: '{"extra_body":{"chat_template_kwargs":{"enable_thinking":true},"reasoning_budget":1024}}'
  tts:
    magpie-multilingual-tts:
      name: "Magpie TTS (NeMo-Speech.cpp)"
      server: "nemo-speech:50051"
      voice_id: "John"
      model: "magpie-tts-multilingual"
      function_id: ""
      synthesis_mode: stitched
  asr:
    nemotron-asr-streaming-english:
      name: "Nemotron Speech Streaming"
      server: "nemo-speech:50051"
      model: "nemotron-speech-streaming-en-0.6b"
      function_id: ""
