#
# Pipecat adapter settings for browser UI sessions (the `default` profile). A browser streams
# microphone audio continuously, so turns can end on Smart Turn, as in the repository's other
# examples (examples/shared/pipeline_utils.py):
#   - turn.smart_turn true: the shared Smart Turn v3 stop strategy ends a turn when the caller
#     sounds finished, with a 1 s silence fallback (SMART_TURN_STOP_SECS).
#   - vad.stop_secs: not set here; the VAD stop comes from the profile's
#     turn_detection.silence_duration_ms (200 ms in profiles/default.yaml), which hands the turn
#     to Smart Turn.
#   - vad.audio_idle_timeout: not set (Pipecat's default). Only the Tau settings disable it.
#   - turn.stt_ttfs_p99 3.0 and turn.wait_for_transcript false: as in eval.yaml, so a late ASR
#     final does not start a second user turn and a noise-only turn ends with an empty transcript.
#   - audio: the browser transport (WebRTC or the UI WebSocket) comes from the repository's
#     create_transport, at 16 kHz in and 22.05 kHz out (the TTS rate); in_sample_rate must match it.
# The evaluation settings (eval.yaml) are not affected by this file.

vad:
  confidence: null
  start_secs: null
  stop_secs: null
  min_volume: null
  audio_idle_timeout: null

turn:
  user_speech_timeout: null
  user_turn_stop_timeout: null
  stt_ttfs_p99: 3.0
  wait_for_transcript: false
  smart_turn: true

audio:
  in_sample_rate: 16000
  out_sample_rate: null
  out_10ms_chunks: 2
  write_timeout_s: 120.0

tts:
  synthesis_mode: per_sentence
