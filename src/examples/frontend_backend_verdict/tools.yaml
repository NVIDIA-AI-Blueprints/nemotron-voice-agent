#
# Tools of the browser profile (`default`): OpenAI function schemas, listed by the UI's tools
# panel (/api/tools) and run in this process by the backend agent (tools.py, tool_handlers.py).
# OpenAI Realtime sessions (the `eval` profile, Tau) never use these: their client sends its own
# tools. The names, parameters and limits follow the generic domain of the former
# Frontend/Backend Agent example (removed in release 2.3.0).
#
# API keys: get_weather needs WEATHERAPI_KEY, get_stock_price FINNHUB_API_KEY and web_search
# PERPLEXITY_API_KEY. Without its key a tool answers "unavailable" and the agent says so.

get_weather:
  type: function
  function:
    name: get_weather
    description: >-
      Check the current weather: live current conditions for a city or location. Never a
      forecast, history, climate or weather news.
    parameters:
      type: object
      properties:
        city:
          type: string
          maxLength: 200
          description: The city or location
        units:
          type: string
          enum: [celsius, fahrenheit]
          description: Temperature units (default celsius)
      required:
        - city

get_stock_price:
  type: function
  function:
    name: get_stock_price
    description: >-
      Check a current stock price: a live public-company quote. Never news, predictions,
      crypto, commodities or price history.
    parameters:
      type: object
      properties:
        company_name:
          type: string
          maxLength: 200
          description: The company name or stock ticker
      required:
        - company_name

web_search:
  type: function
  function:
    name: web_search
    description: >-
      Search the live web for current, recent, forecast, changing, externally verifiable or
      uncertain information.
    parameters:
      type: object
      properties:
        query:
          type: string
          maxLength: 1000
          description: What to look up
      required:
        - query

calculate_bmi:
  type: function
  function:
    name: calculate_bmi
    description: >-
      Calculate an adult's body mass index (BMI) from weight in kilograms and height in metres.
      Never infer the weight or height.
    parameters:
      type: object
      properties:
        weight_kg:
          type: number
          minimum: 1
          maximum: 1000
          description: Weight in kilograms
        height_m:
          type: number
          minimum: 0.3
          maximum: 4
          description: Height in metres
      required:
        - weight_kg
        - height_m

generate_random_number:
  type: function
  function:
    name: generate_random_number
    description: >-
      Generate one random whole number between min and max, inclusive. Use only when the user
      explicitly asks for a random number.
    parameters:
      type: object
      properties:
        min:
          type: integer
          minimum: -1000000000
          maximum: 1000000000
          description: Smallest allowed value (default 1)
        max:
          type: integer
          minimum: -1000000000
          maximum: 1000000000
          description: Largest allowed value (default 100)
