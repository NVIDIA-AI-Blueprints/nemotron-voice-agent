#
# Browser microphone test with an audible frontend: browser_demo.yaml plus spoken
# filler and a simulated slow backend (a fixed sleep before each delegated backend
# turn), so the filler is heard while the backend works.

extends: browser_demo.yaml

filler:
  mode: speak

agent:
  overrides:
    backend:
      simulated_delay_s: ${FBA_BACKEND_DELAY_S:-5}
