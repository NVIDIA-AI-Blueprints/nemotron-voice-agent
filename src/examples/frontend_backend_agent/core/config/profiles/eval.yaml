#
# The `eval` profile: the agent settings for OpenAI Realtime sessions and for voice
# evaluation runs. Every Realtime session uses it, whichever profile the container serves
# (FBA_PROFILE only decides whether browser UI sessions are served too). It pins every
# eval-relevant key explicitly, so a later edit to voice_agent.yaml cannot silently change eval
# behaviour. Run the benchmark with --max-concurrency 1 until max_sessions is measured.
#
# This is the former default eval arm, with its extends
# chain (eval -> _frontend_verdict -> _speak -> _speak_history) flattened into one file; its
# merged config is unchanged (tests/unit/frontend_backend_agent/test_fba_golden.py). The prompt
# catalog is the pinned customer_service profile (core/config/prompts/customer_service.yaml), unless
# FBA_PROMPT_PROFILE names another one.

extends: ../voice_agent.yaml

server:
  # A benchmark client can freeze its tick loop for up to ~90 s at a time (synchronous user-simulator
  # LLM and TTS calls) and stops reading the socket; the agent's streamed audio then
  # fills the client's receive queue, so its pongs stop and a keepalive ping would
  # close a healthy session mid-task. The eval client is local; keepalive is off.
  ws_ping_interval_s: 0

agent:
  overrides:
    backend:
      # Backend conversation history, with the default guidance. Pinned here, so
      # FBA_BACKEND_HISTORY cannot change eval behaviour.
      conversation_history: {enabled: true, include: full}

turn_detection:
  # The benchmark client sends silence_duration_ms 500, which splits spelled-out IDs into several
  # turns; the agent's own values win. threshold and prefix equal the client's (0.5, 300 ms).
  silence_duration_ms: 800
  honor_client_values: false

protocol:
  greeting: {enabled: false, text: ""}
  seed_history_with_client_greeting: "Hi! How can I help you today?"
  auto_response: true
  resume_on: response_create

# The frontend's filler is spoken, so the simulated user hears it and can answer it.
# FBA_FILLER_MODE=log_only (docker/docker-compose.fba-silent-frontend.yaml only) logs it instead, so a
# single-turn evaluation scores the answer alone. Never set it to an empty value.
filler:
  mode: "${FBA_FILLER_MODE:-speak}"

tools:
  source: client

instructions:
  apply_to: [backend]
  placement: policy_slot
  frontend_capabilities: from_tools
  # One Realtime endpoint serves every benchmark domain, so the telecom domain notes
  # (prompt key backend_domain_notes) are selected from the session's tools.
  domain_from_tools:
    telecom: {tools_any: [get_customer_by_phone]}

barge_in:
  enabled: true
  history: truncate_heard
  interruption_marker: " [interrupted by the user]"
  # The frontend decides whether a barge-in while the backend thinks cancels the request.
  while_thinking: frontend_verdict

# Identifier normalization. The transcript hook writes spoken user IDs in lower-case written form
# for the agent (the wire keeps the raw ASR text); the tool-argument hook canonicalizes
# get_user_details.user_id and answers a malformed or already-failed ID locally instead of sending
# it to the client.
normalization:
  transcript:
    enabled: true
    case: lower
    frontend_note_key: identifier_note_voice
  tool_arguments:
    enabled: true
    rules:
      - tool: get_user_details
        argument: user_id
        label: user ID
        format_hint: firstname_lastname_1234
        spoken_form: true
        strip: " .-"
        collapse_separators: "_"
        case: lower
        pattern: '^[a-z]+_[a-z]+_\d{4}$'
        on_invalid: answer_locally
    retry_guard:
      enabled: true
      scope: rules
      # The benchmark's lookup error ("Error: User jordan_lee_82 not found"); transient errors never match.
      permanent_failure_pattern: '^Error: .*\bnot found\b'
