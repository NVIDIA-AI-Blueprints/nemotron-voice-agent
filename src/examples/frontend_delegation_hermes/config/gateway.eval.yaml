#
# Gateway of profiles/realtime_eval.yaml: gateway.yaml with every backend prompt variant pinned, so a
# later edit to the defaults cannot change an evaluation. Detects telecom only and gives it the telecom
# domain note (analysis/2026-10-11_fdh-telecom-gpt55-deep; gateway.eval_no_note.yaml is its ablation). Every
# tau3-geval-failure-fixes-plan.md backend fix is on; gateway.eval_control.yaml (the geval runs' backend
# prompts) turns them off. Records the backend decision trace.

extends: gateway.yaml

prompt_features:
  spelling_v2: true
  spoken_output: true
  write_consent: true
  phone_format: true
  domain_notes: true              # the telecom note only
  # tau3-geval-failure-fixes-plan.md section 4: on (off in gateway.eval_control.yaml).
  format_correction: true
  write_consent_v2: true
  policy_check: true
  request_scope: true
  transfer_check: true
  capability_check: true
  # fix-plan-f1-f2-f4-f8.md: on (off in gateway.eval_124acf7.yaml and gateway.eval_control.yaml).
  situational_facts: true
  identity_from_identifier: true

hermes:
  # P0.3: the clean controls and the arms record each model request and response for the G2 decision
  # replay (logging only). FDH_BACKEND_TRACE=false turns it off.
  backend_trace: ${FDH_BACKEND_TRACE:-true}

domains:
  telecom: {tools_any: [get_customer_by_phone]}
