#
# Real worker processes and sockets without Hermes: FakeAgent under any Python.
# For CI-style checks and a GPU/credential-free gateway smoke run.

extends: gateway.yaml
workers:
  agent_kind: fake
  python: ${FDH_TEST_PYTHON:-self}           # self -> the gateway's own interpreter
  start_timeout_s: 10
  home_root: ${FDH_HERMES_HOME_ROOT:-.cache/fdh-hermes-homes-fake}
hermes:
  run_hard_deadline_s: 330
