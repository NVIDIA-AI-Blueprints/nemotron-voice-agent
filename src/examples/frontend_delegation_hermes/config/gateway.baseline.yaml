#
# Control gateway of every tau3-failure-fixes-plan.md and tau3-identity-fixes-plan.md evaluation:
# gateway.yaml with every backend prompt variant pinned off, so the backend prompts are byte-identical
# to agent commit 3a7e04a.
# Pair it with profiles/tau3_eval_baseline.yaml. The gateway.<variant>.yaml arms extend this file.

extends: gateway.yaml

prompt_features:
  spelling_v2: false
  spoken_output: false
  write_consent: false
  domain_notes: false
  phone_format: false
  format_correction: false
  write_consent_v2: false
  policy_check: false
  request_scope: false
  transfer_check: false
  capability_check: false
  situational_facts: false
  identity_from_identifier: false
