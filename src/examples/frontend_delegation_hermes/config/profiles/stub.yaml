#
# No-GPU, no-LLM smoke run: pair with --stub-speech. Rule-based frontend decider and an
# in-process gateway with a fake backend agent (no Hermes, no network).

extends: ../delegation_agent.yaml

delegation:
  speak_when_delegating: true
  spelling_hold:
    complete_patterns: ['^[A-Za-z0-9]{6}$']   # a 6-character code (e.g. XB7TP2)
tools:
  executor: wire
frontend:
  decider: scripted
backend:
  link: in_process_fake
  simulated_delay: {seconds: 0, where: per_delegation}
  status_verbalizer: {mode: template}
