#
# Browser microphone page (https on 8776): demo tools run in the voice server, and every
# delegation that starts a backend run waits FDH_BACKEND_DELAY_S seconds (default 5) first,
# so "what's the update?" and steering can be tried while the backend is WORKING.

extends: ../delegation_agent.yaml

voice_profile: ../voice/browser.yaml

backend:
  simulated_delay:
    seconds: "${FDH_BACKEND_DELAY_S:-5}"
    where: per_delegation
tools:
  executor: local
