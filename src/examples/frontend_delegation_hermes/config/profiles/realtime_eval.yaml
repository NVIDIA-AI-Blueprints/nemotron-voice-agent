#
# Domain-agnostic evaluation profile (OpenAI Realtime server on 8775): one frozen profile for every
# domain. Tool-argument rules, result-hint targets and spelling-hold patterns are derived per session
# from the client's tool schemas; nothing is selected by a tool or domain name. Pair with
# gateway.eval.yaml. See tau3-voice-domain-specific-changes-genericization.md section 5.

extends: ../delegation_agent.yaml

voice_profile: ../voice/realtime_eval.yaml

delegation:
  speak_when_delegating: true
  spelling_hold:
    enabled: true
    hold_ms: 1500
    complete_patterns: auto   # strict shapes of the identifier examples in the session's tool schemas
  # fix-plan-f1-f2-f4-f8.md F1 + F2 (no dead air), on by default; realtime_eval_124acf7.yaml turns them off.
  guards:
    liveness_reply: true          # R1: a silent reply to a ping or a repeat request is delegated (or replayed)
    question_never_silent: true   # R2: a silent reply to a question is delegated
    ping_as_status: true          # R3: a ping while WORKING is a status request, never a steer
  replay_unheard_answer: {enabled: true, ttl_s: 60, triggers: [backchannel, ping, repeat], whole_if_heard_below: 0.2}
  filler_dedupe: {enabled: true, recent: 3}
backend:
  link: websocket
  simulated_delay: {seconds: 0, where: per_delegation}
output:
  proactive_status: {enabled: true, after_s: "${FDH_PROACTIVE_AFTER_S:-15}", max_per_run: 1}
  clean_answers: true
tools:
  executor: wire
prompt_features:
  replay_intent: false
