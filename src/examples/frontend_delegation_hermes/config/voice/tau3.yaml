#
# tau3-bench voice evaluation: client tools executed by tau2, no greeting (tau2 greets in text),
# the tau2 greeting seeded into both agents' history, tool-argument normalization on.
# Historical: the rule below is selected by a tool name; voice/realtime_eval.yaml derives rules from
# the session's tool schemas instead (tau3-voice-domain-specific-changes-genericization.md 4.5).

extends: base.yaml

protocol:
  greeting: {enabled: false, text: ""}
  seed_history_with_client_greeting: "Hi! How can I help you today?"

tools:
  source: client

normalization:
  tool_arguments:
    enabled: true
    rules:
      - tool: get_user_details
        argument: user_id
        label: user ID
        format_hint: firstname_lastname_1234
        spoken_form: true
        strip: " .-"
        collapse_separators: "_"
        case: lower
        pattern: '^[a-z]+_[a-z]+_\d{4}$'
        on_invalid: answer_locally
    retry_guard:
      enabled: true
      scope: rules
      permanent_failure_pattern: '^Error: .*\bnot found\b'
