#
# Pipecat adapter, demo: the browser profile (greeting, demo tools in the server). Turn detection
# and VAD are Pipecat's (config/adapters/pipecat.yaml); the turn_detection values inherited here
# are only echoed in session.updated. Barge-in is a plain interruption: FDH never second-guesses
# an interruption Pipecat has already made.

extends: browser.yaml

server:
  port: ${FDH_VOICE_PORT:-8776}

barge_in:
  enabled: true
  while_thinking: cancel_and_merge
