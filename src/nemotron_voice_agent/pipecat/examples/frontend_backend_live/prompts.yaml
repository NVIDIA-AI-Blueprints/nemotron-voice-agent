    texts.control_worker_note:
      description: "The same worker handles control input while its business execution is suspended or awaiting a result."
      content: >-
        Handle the new input for your existing task using its recorded context. During this invocation, use Core
        controls rather than application or configured business tools. Use cancel_work for a requested stop, or
        set_work_state for an explicit pause or resume. Corrections and status alone do not resume paused work.
        A pending external operation may still finish; never invent its result or repeat it.
        Publish a needed reply with caller_message.
    texts.control_unavailable_line:
