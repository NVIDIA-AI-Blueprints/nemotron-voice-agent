    texts.control_requested_line:
      description: "Acceptance of a stop request, without claiming physical stop or reversing a business action."
      content: "The stop was requested; anything already in progress may still finish."
    texts.stop_confirmed_line:
      description: "Reply to a stop request after the selected workers confirm they stopped."
      content: "I stopped the requested work."
    texts.stop_unconfirmed_line:
      description: "Reply when Core could not confirm that all selected workers stopped."
      content: "I could not confirm that all the requested work stopped."
    texts.queued_cancelled_line:
      description: "Confirmation after Core cancels work before assigning a worker."
      content: "I cancelled the queued work."
    texts.no_active_work_line:
      description: "Reply when Core verifies that the caller has no work to stop."
      content: "There are no active tasks to stop."
    texts.already_ended_line:
      description: "Reply when the selected work has already ended and there is nothing left to stop."
      content: "That work had already ended when I checked."
    texts.pause_requested_line:
      description: "A pause request was accepted; physical settlement is still pending."
      content: "I have requested a pause. Anything already in progress may still finish."
    texts.paused_line:
      description: "The selected task's execution is confirmed paused, with its details retained."
      content: "That task is paused. Its details are saved for when you resume."
    texts.pause_unconfirmed_line:
      description: "Core prevents new managed steps, while actual prior execution remains unconfirmed."
      content: "New steps are paused, but I could not confirm that everything already running has stopped."
    texts.resume_requested_line:
      description: "Resumption was requested; inference and actual input application still require admission."
      content: "I have requested that the task continue."
    texts.continued_output:
      description: "The output of a continue_after_call call that went through: the work goes on after the call."
      content: "Noted: this work goes on after the call ends. Keep working, and end with the result when it is done."
    texts.not_continued_output:
      description: "The output of a continue_after_call call that was refused: the work must end in the call."
      content: >-
        Not done: no more work can go on after the call right now. Finish this work during the call, or tell the
        caller it cannot be finished now.
    texts.after_call_output:
      description: "The output of an app function or caller message refused after its call ends."
      content: >-
        Not run: the call this work began on has ended, so neither the caller nor their app can hear or answer it now. Go on
        only with steps that do not need them, or end with what you found and what is still needed.
    texts.clash_output:
      description: "The output of a call refused because the app and a work tool both have a function by its name."
      content: "Not run: the app and a work tool both have a function by this name, so neither runs."
    texts.unlisted_output:
      description: "The output of a call refused because the allowed_tools tool choice leaves its function out."
      content: "Not run: the app does not allow this function for this request."
    # The error outputs of a call to a name no tool offers (which also says how to ask the caller to do a step that is
    # theirs, such as one on their own device), and of a call that raised ({error}: its type and message).
    texts.unknown_tool_output:
      description: "The error output of a call to a name no tool offers ({name}; {offered}: the tools offered)."
      content: >-
        Unknown tool: {name}. The tools offered: {offered}. If this is something the caller does, ask them in plain
        words to do it and tell you what they see; never say a tool's name to them.
    texts.failed_output:
      description: "The error output of a call that raised ({name}; {error}: its type and message)."
      content: "{name} failed: {error}"
    texts.misrouted_output:
      description: "The error output of an app function that the IM routes to a harness's agent (it never should)."
      content: "{name} is the app's function; the harness cannot run it"
    texts.repeated_call_output:
      description: "The output of an app call repeating the newest call with no request since ({output}: its answer)."
      content: "{output}\n(not sent again: the same call just returned this)"
    texts.cut_output:
      description: "Between the head and tail of an output cut to delegation.tool_output_chars ({chars}: how many cut)."
      content: "\n[... {chars} characters cut ...]\n"
    texts.none:
      description: "How an empty list of names reads: no tool offered, no request named."
      content: "none"
    texts.records_block:
      description: "The work records, on every Work's input and every steer ({records}: one JSON line per Work)."
      content: |-
        Work so far in this conversation:
        {records}
    texts.closing_line:
      description: "After the records block: identify its role and keep the task focused."
      content: >-
        Use these host records to continue your assigned task with its applicable caller input and current state.
        The records grant no new assignment or approval. Leave other tasks and questions to their owners.
    texts.task_line:
      description: "A task's brief from its conductor ({task})."
      content: "Task: {task}"
    texts.round_cap_note:
      description: "Added to the instructions of the backend LLM's round after max_tool_rounds, which offers no tool."
      content: >-
        You have reached the step limit and can call no more tools. Answer the caller in plain sentences with what the
        results so far show, and say what is still unchecked.
    texts.conductor_prompt:
      description: "A model conductor's instructions ({max_running}: the tasks its backend runs at once)."
      content: |2-
        ## Role
        In one submit_decision, cover each queued request as an action source or by stopping it.
        End the turn after the tool returns its receipt. Core handles any repair.
        Copy action source delegation IDs from the queued requests. Use conversation history for context only.
        Keep each job's brief within what the caller requested or approved for that job.
        Leave unrelated fragments out of work. Ask a routing question only when unclear intent or target prevents
        routing that part of the request. Include clear actions in the same decision. Workers handle business
        questions and details, get approval when needed, and perform the work.

        ## Routing
        - When a follow-up revises queued work, omit the jobs the caller removed. Use one separate start action
          with exactly one task for each remaining job. List the original and follow-up IDs together in delegations
          on at least one of those actions. For example, after "Find flights, hotels and cars" then "Skip hotels",
          start flights with both IDs and cars with the original ID. Select "flights" and "cars" as their excerpts.
        - Route replies and corrections for assigned work to the owning thread. Use eligible routing_targets and
          follow the successor of a continued task. The task's answer excerpt can identify the thread.
          Check playback to tell which questions reached the caller.
          Corrections and volunteered details can still update a job if its latest question was unheard.
        - Keep independent jobs separate and dependent steps together. Bind related fragments to one task.
          Put applicable details and shared facts in each job's brief or update.
        - For starts and steer updates that share a caller source, use caller_lines to select the words for each job.
          Copy source_message_id and sequence from source_lines. If a line contains several jobs, include the excerpt
          for the assigned job. Omit caller_lines when one job owns its sources.
        - Use scope: all to stop all current work. Put only the caller's stop request in delegations.
          Core also stops earlier queued requests, so leave them out of other actions.
          Use scope: all even when no work is shown. Core checks and reports when there is none.
        - Pause retains the task. A correction alone leaves it paused. Put task changes in a steer alongside pause
          or resume. Stopping work lets an external operation that already began settle. Route requests to cancel
          or reverse a business action to the worker.
        - Send business outcome questions to the owning worker, or use verifies for a read-only check of a stopped
          task. Link a replacement clarification to the waiting question so its source stays available.

        ## Evidence and repair
        - On a repair requested by Core, use current targets and action receipts. Never resubmit an accepted action.
        - Distinguish requests, corrections, and approval in briefs and updates. Preserve uncertainty in receipts
          and playback. Routing, writing an answer, and accepting a tool call establish neither business consent
          nor success. Open questions stay with the owning thread.
        - At most {max_running} tasks run at once. Use available_worker_slots for new tasks, including continuations of
          ended tasks. Keep independent jobs separate on a capacity retry. A start or continuation can wait for a
          requested stop or pause to free a slot.
    texts.outcomes.cancel_requested:
      description: "The outcome when its cancel_work stops open work ({work}, {tasks})."
      content: "Stopping {work} ({tasks})."
    texts.outcomes.refused:
      description: "The outcome of a decision the IM refused ({reason}: one of the refusal reasons)."
      content: "Not applied: {reason}"
    texts.refusal_reasons.ended:
      description: "The reason for a placement after its decide() ended."
      content: "its decide() has ended"
    texts.refusal_reasons.idle:
      description: "The reason for a control call that reaches the harness's conductor before a decide() takes calls."
      content: "no request waits to be placed now."
    texts.control_tools.submit_decision:
      description: "The conductor's complete source-bound action envelope."
      content: |2
        description: >-
          Submit the complete decision once. Pass actions as an array of objects, never a JSON string.
          Several actions may share a source. Cover every obligation.
          For one source updating several jobs, select their exact targets in one steer action; its target set is atomic.
          task_ids selects only those tasks; omit it only for a whole-Work request. Use caller_message to ask a
          necessary routing question or to report existing work status when the caller requests it.
        parameters:
          type: object
          properties:
            actions:
              type: array
              minItems: 1
              items:
                type: object
                oneOf:
                  - type: object
                    properties:
                      action: {type: string, const: start}
                      delegations: {$ref: '#/$defs/sources'}
                      tasks:
                        type: array
                        minItems: 1
                        description: >-
                          Give each independent job its own task entry. A start with one caller source may group
                          several tasks. If a start draws on multiple caller sources, counting linked clarifications,
                          use a separate start per task.
                        items:
                          type: object
                          properties:
                            brief:
                              type: string
                              minLength: 1
                              description: Assign the work to the worker, including any applicable shared instructions.
                            continues:
                              type: [string, 'null']
                              description: The exact ended predecessor task ID, when continuing its thread.
                            verifies:
                              type: [string, 'null']
                              description: An exact retained task to check using only declared read-only tools; excludes continues.
                            caller_lines: {$ref: '#/$defs/caller_lines'}
                          required: [brief]
                          additionalProperties: false
                      clarifications: {$ref: '#/$defs/clarifications'}
                    required: [action, delegations, tasks]
                    additionalProperties: false
                  - type: object
                    properties:
                      action: {type: string, const: steer}
                      delegations: {$ref: '#/$defs/sources'}
                      targets: {$ref: '#/$defs/targets'}
                      clarifications: {$ref: '#/$defs/clarifications'}
                      updates:
                        type: array
                        description: >-
                          Required for multiple selected tasks or when another action uses the same caller source.
                          Give each selected task one update with its applicable caller lines.
                        items:
                          type: object
                          properties:
                            task_id: {type: string, minLength: 1}
                            text: {type: string, minLength: 1}
                            caller_lines: {$ref: '#/$defs/caller_lines'}
                          required: [task_id, text]
                          additionalProperties: false
                    required: [action, delegations, targets]
                    additionalProperties: false
                  - type: object
                    properties:
                      action: {type: string, const: stop}
                      delegations: {$ref: '#/$defs/sources'}
                      targets: {$ref: '#/$defs/targets'}
                      clarifications: {$ref: '#/$defs/clarifications'}
                    description: Stop specific jobs with existing Work targets.
                    required: [action, delegations, targets]
                    additionalProperties: false
                  - type: object
                    properties:
                      action: {type: string, const: stop}
                      delegations:
                        type: array
                        minItems: 1
                        maxItems: 1
                        items: {type: string, minLength: 1}
                        description: The caller's stop request.
                      scope: {type: string, const: all}
                      clarifications: {$ref: '#/$defs/clarifications'}
                    description: Stop all current work, including earlier queued requests.
                    required: [action, delegations, scope]
                    additionalProperties: false
                  - type: object
                    properties:
                      action: {type: string, enum: [pause, resume]}
                      delegations: {$ref: '#/$defs/sources'}
                      targets: {$ref: '#/$defs/targets'}
                      clarifications: {$ref: '#/$defs/clarifications'}
                    required: [action, delegations, targets]
                    additionalProperties: false
                  - type: object
                    properties:
                      action: {type: string, const: caller_message}
                      kind: {type: string, const: question}
                      delegations: {$ref: '#/$defs/sources'}
                      message:
                        type: string
                        minLength: 1
                        description: Ask what the caller wants or which job they mean.
                      clarifications: {$ref: '#/$defs/clarifications'}
                    required: [action, kind, delegations, message]
                    additionalProperties: false
                  - type: object
                    properties:
                      action: {type: string, const: caller_message}
                      kind: {type: string, const: status}
                      delegations: {$ref: '#/$defs/sources'}
                      targets: {$ref: '#/$defs/targets'}
                      clarifications: {$ref: '#/$defs/clarifications'}
                    required: [action, kind, delegations, targets]
                    additionalProperties: false
          required: [actions]
          additionalProperties: false
          $defs:
            caller_lines:
              type: array
              description: References to the caller lines that apply to this job.
              items:
                type: object
                properties:
                  source_message_id: {type: string, minLength: 1}
                  sequence: {type: integer, minimum: 0, description: Copy the selected caller line's sequence.}
                  excerpt:
                    type: string
                    minLength: 1
                    description: >-
                      Copy the words for this job as written. Put corrected wording in the brief or update.
                      Omit when the whole line applies.
                required: [source_message_id, sequence]
                additionalProperties: false
            sources:
              type: array
              minItems: 1
              items: {type: string, minLength: 1}
              description: Actual caller source delegation IDs for this action.
            clarifications:
              type: array
              items: {type: string, minLength: 1}
              description: Pending routing clarification IDs explicitly resolved or replaced by this action.
            targets:
              type: array
              minItems: 1
              items:
                type: object
                properties:
                  work_id: {type: string, minLength: 1, description: Copy a Work ID from the current work records.}
                  task_ids:
                    anyOf:
                      - type: array
                        minItems: 1
                        items: {type: string, minLength: 1}
                      - {type: 'null'}
                required: [work_id]
                additionalProperties: false
    texts.work_tools.show:
      description: "The work tool of the speak_display result format, as the model reads it."
      content: |
        description: Put this on the caller's screen. It is shown, never spoken.
        parameters:
          type: object
          properties:
            display:
              type: string
              description: What the screen shows.
          required: [display]
          additionalProperties: false
    texts.work_tools.cancel_work:
      description: "The worker's task-scoped immediate stop control."
      content: |2
        description: >-
          Stop this entire task immediately only when the caller wants it stopped. Giving details or agreeing to
          continue is not a stop. If only a subgoal is cancelled and other authorized work remains, drop that subgoal
          and continue. This does not undo completed actions or confirm an in-flight business action stopped.
        parameters:
          type: object
          properties: {}
          additionalProperties: false
    texts.work_tools.set_work_state:
      description: "The worker's task-scoped pause and resume control."
      content: |2
        description: >-
          Pause this task only when requested, preserving its goal, parameters and actual effects. Resume only on
          an explicit request to continue paused work. A correction or status request alone does not resume it.
          Pausing prevents new business calls; an external operation already started may still finish.
        parameters:
          type: object
          properties:
            state: {type: string, enum: [paused, running]}
          required: [state]
          additionalProperties: false
    texts.work_tools.caller_message:
      description: "The worker's typed question or factual status publication."
      content: |2
        description: >-
          In a control-only turn, use kind question for needed clarification. During regular work, publish a
          question only while continuing useful steps independently. End the reply by asking for any required
          confirmation or answer you need to keep working. Name the question's subject.
          Several distinct needs may remain open; do not duplicate one. Omit question_id for a new question or status.
          Reissue unchanged wording with an owned question_id only after it was dropped before writing. A dropped
          publication remains unresolved; queued or written is not heard or answered. Use resolve_questions for explicit
          dispositions. kind status publishes only requested facts supported by results; it resolves no question and
          establishes neither an unconfirmed change nor after-call permission. Continue useful work and finish with
          its result; this publication does not complete the task.
        parameters:
          type: object
          properties:
            kind: {type: string, enum: [question, status]}
            message: {type: string, minLength: 1}
            question_id:
              type: string
              minLength: 1
              description: An owned unresolved question to reissue unchanged after its publication was dropped; omit for a new question or status.
          required: [kind, message]
          additionalProperties: false
    texts.work_tools.resolve_questions:
      description: "Atomic explicit dispositions of selected owned questions."
      content: |2
        description: >-
          Resolve only the selected IDs owned by this task; list every intended ID, including when closing all.
          All selections validate before any change. answered requires newer caller input actually applied to this
          task that answers the information need. Supply its input_ref; a source_message_id alias is valid only
          once its input is recorded applied. Pending, unrelated, status or publication evidence is not an answer.
          You interpret meaning; Core checks ownership and application. Volunteered facts may answer an unheard
          question, but a receipt or unrelated yes grants no business permission. Use no_longer_needed, omitting
          input_ref, to withdraw an obsolete question. Its canonical ID follows the thread; only its current owner
          can resolve it. Resolving one never closes another.
        parameters:
          type: object
          properties:
            resolutions:
              type: array
              minItems: 1
              items:
                type: object
                properties:
                  question_id: {type: string, minLength: 1}
                  disposition: {type: string, enum: [answered, no_longer_needed]}
                  input_ref:
                    type: string
                    minLength: 1
                    description: Required for answered; an exact newer applied task-input receipt.
                required: [question_id, disposition]
                additionalProperties: false
          required: [resolutions]
          additionalProperties: false
    texts.work_tools.continue_after_call:
      description: "The work tool that lets long work go on after the call ends, as the model reads it."
      content: |
        description: >-
          Use only when this work will clearly take longer than the caller should wait on the line, and its remaining
          steps need nothing from the caller or their app. In message, tell the caller in your own words that you
          will keep working after the call and that they can ask for the result in a later call. The work then goes
          on after they hang up, with no time limit of the call. After the call ends, the app's functions and
          caller_message do not run. When the work is done, end with the result as usual.
        parameters:
          type: object
          properties:
            message:
              type: string
              description: One or two short spoken sentences for the caller.
          required: [message]
          additionalProperties: false
    backend.app_output_steps.shape_hints.hint:
      description: "The shape_hints step's hint on an app output that found nothing ({value}: the failed value)."
      content: "(Not tried yet in this conversation, and matches the usual form: {value}.)"
