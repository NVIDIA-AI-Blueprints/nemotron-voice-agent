<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img" aria-labelledby="t d">
  <title id="t">LiveKit generic assistant architecture</title>
  <desc id="d">Clients are on the left and connect to the LiveKit server in the middle, which connects to the agent worker on the right. A browser connects over WebRTC, and a UI server serves the page and issues join tokens. Optionally, a phone or SIP provider connects through a SIP service with Redis to the same LiveKit server. The agent worker calls an ASR model, an LLM, and a TTS model, and runs the tools of the selected use case.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="960" height="420" fill="#fff"/>

  <!-- column labels -->
  <g fill="#777" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">
    <text x="125" y="28">CLIENTS</text>
    <text x="395" y="28">LIVEKIT</text>
    <text x="750" y="28">AGENT</text>
  </g>

  <!-- clients -->
  <g fill="#f4f4f4" stroke="#555" stroke-width="1.5">
    <rect x="30" y="60" width="190" height="90" rx="8"/>
    <rect x="30" y="185" width="190" height="75" rx="8"/>
    <rect x="300" y="60" width="190" height="100" rx="8"/>
  </g>
  <g fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="30" y="300" width="190" height="70" rx="8"/>
    <rect x="300" y="300" width="190" height="70" rx="8"/>
  </g>

  <!-- agent worker -->
  <rect x="570" y="40" width="360" height="350" rx="10" fill="#f9fbf3" stroke="#76b900" stroke-width="2"/>
  <g fill="#fff" stroke="#76b900" stroke-width="1.5">
    <rect x="600" y="100" width="300" height="50" rx="6"/>
    <rect x="600" y="170" width="300" height="50" rx="6"/>
    <rect x="600" y="240" width="300" height="50" rx="6"/>
    <rect x="600" y="310" width="300" height="50" rx="6"/>
  </g>

  <g fill="#222" text-anchor="middle">
    <text x="125" y="100" font-weight="bold">Browser UI</text><text x="125" y="122">livekit-client, mic, transcript</text>
    <text x="125" y="218" font-weight="bold">UI server</text><text x="125" y="240">static files, /token</text>
    <text x="125" y="332" font-weight="bold">Phone or SIP provider</text><text x="125" y="352" font-size="12">optional, e.g. a contact center</text>
    <text x="395" y="100" font-weight="bold">LiveKit server</text><text x="395" y="122">WebRTC room, data channel</text>
    <text x="395" y="332" font-weight="bold">LiveKit SIP + Redis</text><text x="395" y="352" font-size="12">optional: run.sh up --sip</text>
    <text x="750" y="64" font-weight="bold" font-size="16">Agent worker (LiveKit Agents)</text>
    <text x="750" y="84" font-size="12">Silero VAD, barge-in, tool calls</text>
    <text x="750" y="130">ASR model (gRPC, NVIDIA plugin)</text>
    <text x="750" y="200">LLM (OpenAI-compatible API)</text>
    <text x="750" y="270">TTS model (gRPC, NVIDIA plugin)</text>
    <text x="750" y="340">Tools for the selected use case</text>
  </g>

  <!-- browser path -->
  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)" marker-start="url(#a)">
    <path d="M220 105 H300"/>
    <path d="M490 110 H570"/>
  </g>
  <g stroke="#555" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a)">
    <path d="M125 185 V150"/>
  </g>

  <!-- phone path (optional) -->
  <g stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#p)" marker-start="url(#p)">
    <path d="M220 335 H300"/>
    <path d="M395 300 V160"/>
  </g>

  <g fill="#555" font-size="12">
    <text x="224" y="97">audio, events</text>
    <text x="500" y="101">room audio</text>
    <text x="135" y="172">join token</text>
  </g>
  <g fill="#7c3aed" font-size="12">
    <text x="230" y="326">SIP, RTP</text>
    <text x="405" y="235">caller joins the room</text>
  </g>

  <text x="480" y="412" text-anchor="middle" fill="#555" font-size="12">Dashed: optional. ASR, LLM, and TTS run on NVIDIA Cloud or in local sidecars, depending on the profile.</text>
</svg>
