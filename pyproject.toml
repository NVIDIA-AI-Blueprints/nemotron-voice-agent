[project]
name = "nemotron-voice-agent"
version = "2.4.0"
description = "End-to-end voice agent blueprint powered by NVIDIA Nemotron ASR, LLM, and TTS"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "python-dotenv>=1.2.2",
    "loguru>=0.7.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
nva-pipecat = "nemotron_voice_agent.pipecat.runtime.server:main"
nva-livekit = "nemotron_voice_agent.livekit.examples.generic_assistant.agent:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemotron_voice_agent"]

[dependency-groups]
pipecat = [
    "pipecat-ai[nvidia,silero,runner,webrtc,websocket,openai]==1.15.0",
    "opentelemetry-exporter-otlp-proto-http>=1.40.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.40.0",
    "langchain-nvidia-ai-endpoints>=1.2.1",
    "imageio-ffmpeg>=0.5.1",
]
livekit = [
    "livekit-agents>=1.8.11,<2",
    "livekit-plugins-silero>=1.8.11,<2",
    "livekit-plugins-openai>=1.8.11,<2",
    "livekit-plugins-nvidia",
]
dev = [
    "ruff>=0.15.6",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
]
eval = [
    "pipecat-ai[evals]==1.15.0",
]
# Dependencies for everything under `benchmarking_tools/`. Install with:
#   uv sync --group benchmark
benchmark = [
    "websockets>=14.0",
    "numpy>=2.0.0",
    "resampy>=0.4.3",
    "soundfile>=0.13.0",
    "aiohttp>=3.11.0",
    "requests>=2.32.0",
    "grpcio>=1.67.0",
    "nvidia-riva-client>=2.27.0",
    "datasets>=2.19.0",
    "huggingface-hub>=0.23.0",
]
# The protocol packages of the Frontend/Backend Live harness backend adapter (`core.backend.adapter: harness`): Hermes
# over ACP, tools over MCP. Imported only by
# src/nemotron_voice_agent/pipecat/examples/frontend_backend_live/delegation_core/backend/harness.
harness = [
    "agent-client-protocol==0.9.0",
    "mcp>=2.2.0",
]

[tool.uv]
default-groups = ["pipecat", "livekit", "harness", "dev"]
# Force patched versions for known CVEs. The livekit-agents and silero overrides keep both on PyPI: uv applies the
# livekit/agents workspace sources to the git NVIDIA plugin's own dependencies, which would pull them from git too, and
# the silero model (silero_vad.onnx) is a Git LFS file there, so a git install gets a text pointer and the agent
# crashes. Remove those two overrides together with the git source when livekit-plugins-nvidia 1.8.12 ships.
override-dependencies = [
    "cryptography>=50.0.0",
    "idna>=3.15",
    "starlette>=1.0.1",
    "protobuf>=6.33.6",
    "langchain-core>=1.4.1",
    "uuid-utils>=0.16.0",
    "pillow>=13.0.0",
    "dnspython>=2.9.2",
    "nvidia-riva-client>=2.27.0,<3",
    "multidict>=6.9.1,<7",
    "urllib3>=2.8.0",
    "livekit-agents>=1.8.11,<2",
    "livekit-plugins-silero>=1.8.11,<2",
]

[tool.uv.sources]
livekit-plugins-nvidia = { git = "https://github.com/livekit/agents", subdirectory = "livekit-plugins/livekit-plugins-nvidia", rev = "b7c9e2d0872b2df10ae3f903d091ca331de8b3b7" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." lets tests import shared doubles as tests.unit.<framework>.<module>
pythonpath = ["."]
# The frameworks reuse test file names, so pytest imports each test file by its path
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120
src = ["src", "."]

###############################################################################
# Linting Rules
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # docstring checks
    "D"
]

ignore = ["SIM108", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"
