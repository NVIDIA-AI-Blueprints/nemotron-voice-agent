# Single source of truth for what the UI selector exposes:
#   all            → every registered example (selectable)
#   <example>      → lock to one example (no switching)
#
# The first example listed (YAML insertion order) within the visible set
# becomes the initial default selection.
#
# The ``EXAMPLE_SELECTION`` environment variable overrides this value at
# runtime so the same YAML can drive multiple compose profiles.
selection: all

# Which transport(s) the UI exposes:
#   all        → WebRTC and WebSocket
#   webrtc     → WebRTC only
#   websocket  → WebSocket only
#
# Override at runtime via the ``TRANSPORT_SELECTION`` environment variable.
transports: all

# Each example lists the services it offers per slot from `services.yaml`, in
# UI order. Slots follow the key order; the first entry available in the
# active recipe is the default. A slot reads the catalog category of the same
# name unless `categories` maps it to another one. `settings` overrides
# `settings.yaml` defaults per slot and service key. An example that serves the
# Live API (`/v1/live`) names its hooks under `live` (`factory`, `describe`,
# `core`, each `module.path:callable`, imported on first use) and the gateway's
# settings under `live.settings`; the Live API is served only when the
# selected example has the block. `config` holds an example's own settings,
# which its code validates: a key that the code requires must be set, and any
# other key left out keeps its default in the code.
examples:
  generic-assistant:
    label: Generic Assistant
    services:
      llm: [nemotron-lightning, nemotron-super, nemotron-bolt-74b, nemotron-bolt-4b]
      asr: [nemotron-asr-streaming-english, parakeet-ctc, parakeet-rnnt, nemotron-transcribe]
      tts: [magpie-multilingual-tts, chatterbox-multilingual-tts, magpie-zeroshot-tts]
    capabilities: [streaming_input, speaker_labels]
    activity_check:
      first_warning_s: 480
      second_warning_s: 30
      warning_completion_timeout_s: 45
    defaults:
      prompt: [generic_assistant]
    bot: examples.generic.pipeline:bot

  multilingual-assistant:
    label: Multilingual Assistant
    services:
      llm: [nemotron-lightning, nemotron-super, nemotron-bolt-74b, nemotron-bolt-4b]
      asr: [nemotron-asr-streaming-multilingual, parakeet-rnnt, nemotron-transcribe]
      tts: [magpie-multilingual-tts, chatterbox-multilingual-tts, magpie-zeroshot-tts]
    capabilities: [session_languages]
    agent_prompt_keys:
      - fixed_session_language_addon
    defaults:
      default_session_language: de-DE
      prompt: [multilingual_voice_assistant]
    bot: examples.multilingual.pipeline:bot

  omni-assistant:
    label: Nemotron Omni Assistant
    services:
      llm: [nemotron-omni-nvfp4]
      tts: [magpie-multilingual-tts, chatterbox-multilingual-tts, magpie-zeroshot-tts]
    defaults:
      prompt: [generic_omni_assistant]
    bot: examples.omni_assistant.pipeline:bot

  omni-assistant-subagents:
    label: Nemotron Omni Assistant Subagents
    services:
      llm: [nemotron-omni-nvfp4]
      tts: [magpie-multilingual-tts, chatterbox-multilingual-tts, magpie-zeroshot-tts]
    capabilities: [attachments, webcam]
    defaults:
      prompt: [omni_subagents_assistant]
    bot: examples.omni_assistant_subagents.pipeline:bot

  frontend-backend-agent:
    label: Frontend Backend Agent
    services:
      llm: [nemotron-lightning]
      thinker-llm: [nemotron-lightning]
      asr: [nemotron-asr-streaming-english, parakeet-ctc]
      tts: [magpie-multilingual-tts, chatterbox-multilingual-tts, magpie-zeroshot-tts]
    categories:
      thinker-llm: llm
    settings:
      thinker-llm:
        nemotron-lightning:
          enable_thinking: true
          reasoning_budget: 1024
    defaults:
      prompt: [talker]
    bot: examples.frontend_backend_agent.pipeline:bot

  frontend-backend-live:
    label: Frontend Backend Live
    services:
      llm: [nemotron-lightning]
      thinker-llm: [nemotron-super, nemotron-lightning]
      asr: [nemotron-asr-streaming-english, parakeet-ctc]
      tts: [magpie-multilingual-tts, chatterbox-multilingual-tts, magpie-zeroshot-tts]
    categories:
      thinker-llm: llm
    settings:
      llm:
        nemotron-lightning:
          temperature: 0.0
          max_tokens: 512
          enable_thinking: false
      thinker-llm:
        nemotron-super:
          temperature: 0.0
          max_tokens: 4096
          enable_thinking: true
        nemotron-lightning:
          temperature: 0.7
          max_tokens: 4096
          enable_thinking: true
          reasoning_budget: 256
      tts:
        magpie-multilingual-tts:
          synthesis_mode: per_sentence
        magpie-zeroshot-tts:
          synthesis_mode: per_sentence
    defaults:
      prompt: [cafe]
    bot: examples.frontend_backend_live.pipeline:bot
    # The example's own settings, read once per process (an edit takes effect at the next restart). The block must set
    # frontend.adapter and its block, frontend.cascade.slot, core.backend.slot, core.backend.prompt, and ui_bot.channel;
    # every other key left out keeps its default in the code: config_manager/schema.py for the frontend,
    # delegation_core/config.py for the delegation core, and each backend adapter's settings.py for its block. An
    # unknown key stops the load. The texts that the core and the talker read are the example's prompts.yaml entries.
    config:
      frontend:
        adapter: cascade                 # the frontend adapter that serves each live session; its block follows
        cascade:
          slot: llm                      # the services slot whose selected entry is the talker's model
          talker_style:                  # the talker's style by that entry's services key: json, the JSON decision
            nemotron-lightning: json     # (also for a key not listed), or tools, the routing decision by tool calling
      # The delegation core of Live sessions.
      core:
        backend:
          adapter: llm                   # llm (the backend LLM, directly connected) | llm-agent | harness; with
                                         # llm-agent or harness, also set delegation.result_format: speak_display
          slot: thinker-llm              # the services slot whose selected entry is the backend's default model
          prompt: generic                # the agent_prompts.Backend entry of prompts.yaml for requests with none
          # The steps the app's function outputs take before the backend reads them, none by default. To turn on the
          # ID-shape hints, add this block: after an app lookup finds nothing, the backend is told the failed id in the
          # shape the app's ids take, once. The hint's words are backend.app_output_steps.shape_hints.hint in
          # prompts.yaml (agent_prompts.Core).
          # app_output_steps:
          #   shape_hints:
          #     not_found_pattern: '(?i)\b(not found|does not exist|no such)\b'  # an app output that names nothing
          harness:                       # how the harness reaches the operator's Hermes over ACP
            agent: hermes
            command: [hermes, acp]
            pass_env: [PATH, LANG, LC_ALL, TZ, HERMES_HOME]
            runtime_label: hermes
      # The repository UI bot: the channel context after its talker and backend prompts (agent_prompts.Channel), and
      # its own delegation core, which is the core above with these keys merged over it.
      ui_bot:
        channel: cafe
        core:
          delegation:
            result_format: speak_display # a show item for the task cards, then the answer to speak
          backend:
            adapter: llm
            prompt: cafe
            tools:
              cafe: {}                   # the cafe's menu, cart and order tools
    live:
      factory: examples.frontend_backend_live.factory:create_frontend_adapter
      describe: examples.frontend_backend_live.factory:describe
      core: examples.frontend_backend_live.factory:core
      settings:
        max_sessions: 8
        max_session_seconds: 1800
        max_appends_per_minute: 64
        max_delegate_rounds: 2
        ice_urls: []
        allowed_hosts: []
