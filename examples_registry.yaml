# Single source of truth for what the UI selector exposes:
#   all            → every registered example (selectable)
#   <example>      → lock to one example (no switching)
#
# The first example listed (YAML insertion order) within the visible set
# becomes the initial default selection.
#
# The ``EXAMPLE_SELECTION`` environment variable overrides this value at
# runtime so the same YAML can drive multiple compose profiles.
selection: all

# Which transport(s) the UI exposes:
#   all        → WebRTC and WebSocket
#   webrtc     → WebRTC only
#   websocket  → WebSocket only
#
# Override at runtime via the ``TRANSPORT_SELECTION`` environment variable.
transports: all

# Stable public model ids for the OpenAI Realtime API. Each model selects one
# complete, server-owned pipeline profile; endpoint URLs and credentials remain
# in the example-local service catalogs. Exactly one profile is the default for
# each pipeline. Additional authenticated NVIDIA selectors may refine these
# catalog selections when a client secret is minted.
realtime_models:
  nvidia/nemotron-realtime:
    label: Nemotron Realtime
    pipeline_mode: generic-assistant
    default: true
    selectors:
      prompt_key: generic_assistant
      llm_id: registry-default
      asr_id: registry-default
      tts_id: registry-default

  nvidia/nemotron-realtime-client-tools:
    label: Nemotron Realtime Client Tools
    pipeline_mode: generic-assistant
    default: false
    selectors:
      prompt_key: generic_assistant_without_tools
      llm_id: registry-default
      asr_id: registry-default
      tts_id: registry-default

  nvidia/nemotron-realtime-multilingual:
    label: Nemotron Realtime Multilingual
    pipeline_mode: multilingual-assistant
    default: true
    selectors:
      prompt_key: multilingual_voice_assistant
      llm_id: registry-default
      asr_id: registry-default
      tts_id: registry-default
    platform_overrides:
      cloud:
        # Nemotron Streaming Multilingual is local-only. NVCF exposes Parakeet.
        asr_id: parakeet-rnnt

  nvidia/nemotron-realtime-omni:
    label: Nemotron Realtime Omni
    pipeline_mode: omni-assistant
    default: true
    selectors:
      prompt_key: generic_omni_assistant
      llm_id: registry-default
      tts_id: registry-default

  nvidia/nemotron-realtime-omni-subagents:
    label: Nemotron Realtime Omni Subagents
    pipeline_mode: omni-assistant-subagents
    default: true
    selectors:
      prompt_key: generic_omni_assistant
      llm_id: registry-default
      tts_id: registry-default

  nvidia/nemotron-realtime-frontend-backend:
    label: Nemotron Realtime Frontend Backend
    pipeline_mode: frontend-backend-agent
    default: true
    selectors:
      prompt_key: talker
      llm_id: registry-default
      thinker_llm_id: registry-default
      asr_id: registry-default
      tts_id: registry-default

examples:
  generic-assistant:
    label: Generic Assistant
    slots: [llm, asr, tts]
    activity_check:
      first_warning_s: 480
      second_warning_s: 30
      warning_completion_timeout_s: 45
    defaults:
      prompt: [generic_assistant]
      llm: [nemotron-lightning]
      asr: [nemotron-asr-streaming-english]
      tts: [magpie-multilingual-tts]
    bot: examples.generic.pipeline:bot

  multilingual-assistant:
    label: Multilingual Assistant
    slots: [llm, asr, tts]
    capabilities: [session_languages]
    agent_prompt_keys:
      - fixed_session_language_addon
    defaults:
      default_session_language: de-DE
      prompt: [multilingual_voice_assistant]
      llm: [nemotron-lightning]
      asr: [nemotron-asr-streaming-multilingual]
      tts: [magpie-multilingual-tts]
    bot: examples.multilingual.pipeline:bot

  omni-assistant:
    label: Nemotron Omni Assistant
    slots: [llm, tts]
    defaults:
      prompt: [generic_omni_assistant]
      llm: [nemotron-omni-nvfp4]
      tts: [magpie-multilingual-tts]
    bot: examples.omni_assistant.pipeline:bot

  omni-assistant-subagents:
    label: Nemotron Omni Assistant Subagents
    slots: [llm, tts]
    capabilities: [attachments, webcam]
    defaults:
      prompt: [generic_omni_assistant]
      llm: [nemotron-omni-nvfp4]
      tts: [magpie-multilingual-tts]
    bot: examples.omni_assistant_subagents.pipeline:bot

  frontend-backend-agent:
    label: Frontend Backend Agent
    slots: [llm, thinker-llm, booking-server, asr, tts]
    defaults:
      prompt: [talker]
      llm: [nemotron-lightning]
      thinker-llm: [nemotron-lightning]
      booking-server: [default]
      asr: [nemotron-asr-streaming-english]
      tts: [magpie-multilingual-tts]
    bot: examples.frontend_backend_agent.pipeline:bot
